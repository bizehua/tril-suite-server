<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四语母语习得 · 可朗读解说学习器</title>
<style>
:root{
  --bg:#0e1320; --bg2:#151c2e; --panel:#1a2238; --panel2:#212c47;
  --line:#2c3756; --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  --en:#5b8cff; --bm:#ffb454; --zh:#4fd1a5; --th:#c792ea; --danger:#ff6b6b;
  --glow:0 0 0 2px rgba(91,140,255,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(20,28,46,.7);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;color:var(--muted)}
header .spacer{flex:1}
.progwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.progbar{width:160px;height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--en),var(--zh));transition:width .3s}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:8px 13px;font-size:13px;
  background:var(--panel2);color:var(--txt);transition:.15s;border:1px solid var(--line)}
button:hover{background:#2b3a5e}
button.primary{background:linear-gradient(90deg,var(--en),#7aa2ff);border:none;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{padding:7px 10px}

.layout{flex:1;display:flex;min-height:0}
nav{flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.navstage{margin-bottom:6px}
.navstage>h3{font-size:13px;margin:8px 6px 4px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px}
.navstage .cnt{font-size:11px;color:var(--muted);font-weight:400}
.navfile{display:block;width:100%;text-align:left;margin:2px 0;padding:7px 10px;font-size:13px;
  background:transparent;border:1px solid transparent;border-radius:8px;color:var(--txt)}
.navfile:hover{background:var(--panel2)}
.navfile.active{background:var(--panel2);border-color:var(--accent)}
.navfile .fc{float:right;color:var(--muted);font-size:11px}
.navfile .rt{float:right;color:var(--zh);font-size:10px;margin-right:6px}
.navstage.collapsed .navfile{display:none}

main{flex:1;display:flex;flex-direction:column;min-width:0}
.unitlist{flex:1;overflow-y:auto;padding:18px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.breadcrumb b{color:var(--txt)}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;
  transition:.15s;position:relative;overflow:hidden}
.ucard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ucard .ut{font-size:14px;font-weight:600;line-height:1.4}
.ucard .umeta{font-size:11px;color:var(--muted);margin-top:6px}
.ucard .badge{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.ucard.done .badge{background:rgba(79,209,165,.18);color:var(--zh)}
.ucard .mini{height:4px;background:var(--panel2);border-radius:99px;margin-top:10px;overflow:hidden}
.ucard .mini>i{display:block;height:100%;background:var(--zh)}

.lesson{flex:1;display:flex;flex-direction:column;min-height:0}
.lessonbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.lessonbar .lt{font-size:15px;font-weight:700}
.lessonbar .back{margin-right:4px}
.timeline{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:120px}
.timeline>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--en),var(--bm),var(--zh));transition:width .25s}
.nowlang{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);min-width:54px;text-align:center}
.nowlang.en{color:var(--en);box-shadow:inset 0 0 0 1px var(--en)}
.nowlang.bm{color:var(--bm);box-shadow:inset 0 0 0 1px var(--bm)}
.nowlang.zh{color:var(--zh);box-shadow:inset 0 0 0 1px var(--zh)}
.nowlang.th{color:var(--th);box-shadow:inset 0 0 0 1px var(--th)}
.ttsbanner{position:fixed;top:0;left:0;right:0;z-index:9999;display:none;
  background:linear-gradient(90deg,#3a2a08,#4a350a);color:#ffd591;
  border-bottom:1px solid #6b4f17;padding:10px 16px;font-size:13px;line-height:1.5;
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
.ttsbanner b{color:#ffd591}

.tablewrap{flex:1;overflow-y:auto;padding:14px 18px}
table.vid{width:100%;border-collapse:separate;border-spacing:0 6px}
table.vid th{font-size:11px;color:var(--muted);text-align:left;padding:4px 10px;font-weight:600;letter-spacing:.5px}
table.vid td{padding:11px 12px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.vid td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
table.vid td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
table.vid tr.active td{background:var(--panel2);box-shadow:var(--glow)}
table.vid tr.speak-en td.c-en{background:rgba(91,140,255,.22);box-shadow:inset 3px 0 0 var(--en)}
table.vid tr.speak-bm td.c-bm{background:rgba(255,180,84,.20);box-shadow:inset 3px 0 0 var(--bm)}
table.vid tr.speak-zh td.c-zh{background:rgba(79,209,165,.20);box-shadow:inset 3px 0 0 var(--zh)}
table.vid tr.speak-th td.c-th{background:rgba(199,146,234,.20);box-shadow:inset 3px 0 0 var(--th)}
.c-en .t{color:var(--txt);font-weight:600;font-size:15px}
.c-bm .t{color:#ffd9a3;font-weight:600;font-size:15px}
.c-zh .t{color:#bff3df;font-weight:600;font-size:15px}
.c-th .t{color:#e9cdf7;font-weight:600;font-size:15px}
.ipa{font-size:11px;color:var(--muted);font-family:"Courier New",monospace;margin-top:2px}
.pron{font-size:11px;color:#caa46a;margin-top:2px}
.empty{padding:60px;text-align:center;color:var(--muted)}
/* 收藏标记 ☆/★ */
.c-mark{width:30px;text-align:center;vertical-align:middle}
.mark{display:inline-block;font-size:19px;line-height:1;color:var(--muted);cursor:pointer;user-select:none;transition:.15s}
.mark.on{color:#ffcf5b;text-shadow:0 0 8px rgba(255,207,91,.55)}
.mark:hover{transform:scale(1.18)}

/* 词根派生（母语习得）视图 */
.rootwrap{flex:1;overflow-y:auto;padding:16px 18px}
.roothead{background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(79,209,165,.10));
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.roottitle{font-size:18px;font-weight:800;letter-spacing:.3px}
.rootnote{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.75}
.derivlist{display:flex;flex-direction:column;gap:12px}
.derivcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;transition:.15s;position:relative}
.derivcard.active{box-shadow:var(--glow)}
.derivcard.speak-en{border-color:var(--en)}
.derivcard.speak-bm{border-color:var(--bm)}
.derivcard.speak-zh{border-color:var(--zh)}
.derivcard.speak-th{border-color:var(--th)}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.dw{font-size:17px;font-weight:700}
.dw.l-en{color:var(--en)} .dw.l-bm{color:var(--bm)} .dw.l-zh{color:var(--zh)} .dw.l-th{color:var(--th)}
.langtag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.dpron{font-size:11px;color:var(--muted);margin-top:5px;font-family:"Courier New",monospace}
.ddef{font-size:13px;color:var(--txt);margin-top:8px;line-height:1.6}
.dphrase{font-size:12px;color:#cdd6ea;margin-top:6px;line-height:1.6}
.dexample{margin-top:9px;border-left:3px solid var(--accent);padding-left:11px}
.dexample .ex{font-size:13px;line-height:1.65}
.ex.l-en{color:#cfe0ff}.ex.l-bm{color:#ffe2bb}.ex.l-zh{color:#bff3df}.ex.l-th{color:#e9cdf7}
.playone{margin-top:11px;font-size:12px;padding:6px 12px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:380px;max-width:92vw}
.modal h2{margin:0 0 14px;font-size:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field select,.field input[type=range]{width:100%}
.field select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
.kbd{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
details.notes{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.notes summary{cursor:pointer;font-size:13px;color:var(--accent)}
details.notes .body{font-size:13px;color:var(--muted);line-height:1.8;white-space:pre-wrap;margin-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--accent);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media(max-width:820px){nav{flex-basis:160px}.unitgrid{grid-template-columns:1fr}}
/* ===== 可折叠面板：左侧目录 / 例句区域 / 顶部栏 ===== */
header{transition:max-height .3s ease,padding .3s ease,opacity .25s ease,border-width .3s ease;max-height:160px;overflow:hidden}
body.hide-topbar header{max-height:0;padding-top:0;padding-bottom:0;opacity:0;border-bottom-width:0;pointer-events:none}
nav{transition:width .3s ease,flex-basis .3s ease,opacity .25s ease,padding .3s ease;overflow-x:hidden}
body.hide-sidebar nav{width:0;flex-basis:0;min-width:0;padding-left:0;padding-right:0;opacity:0;border-right-width:0;pointer-events:none}
body.hide-examples .exrow{display:none}
body.hide-examples .dexample{display:none}
/* 布局控制浮窗：顶栏隐藏后仍可切换三个面板 */
#layoutDock{position:fixed;right:12px;bottom:14px;z-index:45;display:flex;gap:6px;background:rgba(26,34,56,.88);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
#layoutDock button{font-size:12px;padding:7px 10px;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:5px}
#layoutDock button.on{background:linear-gradient(90deg,var(--en),#7aa2ff);border-color:transparent;color:#fff}
.laybtn{font-size:12px;padding:7px 10px}
.laybtn.on{background:linear-gradient(90deg,var(--en),#7aa2ff);border-color:transparent;color:#fff}
@media(max-width:820px){#layoutDock{right:8px;bottom:10px;padding:5px}#layoutDock button{padding:6px 8px;font-size:11px}}
</style>

<script>

<script src="三语母语习得学习器.data.js"></script>
<div id="trilSpinner" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1320;color:#93a0bd;z-index:99999;font:14px system-ui">⏳ 正在加载词库…</div>
<script>const DATA = window.__LEARNER_DATA__;
const LS_KEY = "tril_root_progress_v1";
const LS_SET = "tril_root_settings_v1";

let flat = [];
DATA.stages.forEach((st,si)=>st.files.forEach((f,fi)=>f.units.forEach((u,ui)=>{
  flat.push({stage:st.name,file:f.name,si,fi,ui,title:u.title,type:u.type||"table",
    langs:u.langs||["en","zh","bm"],entries:u.entries,summary:u.summary||"",notes:u.notes||""});
})));
const uid = u => u.si+"_"+u.fi+"_"+u.ui;

let progress = {};
try{ progress = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){} }
function isDone(u){ return !!(progress[uid(u)] && progress[uid(u)].done); }
function setDone(u,done){ progress[uid(u)] = Object.assign(progress[uid(u)]||{},{done:done}); saveProgress(); refreshProgress(); }

/* ===== 收藏标记（跨文件共享到测试器「我的收藏」） ===== */
const LS_MARK = "tril_marks_v1";
let marks = {};
try{ marks = JSON.parse(localStorage.getItem(LS_MARK)||"{}")||{}; }catch(e){ marks={}; }
function saveMarks(){ try{ localStorage.setItem(LS_MARK, JSON.stringify(marks)); }catch(e){} }
function mkKey(e){ return (e.en||"")+"|"+(e.bm||"")+"|"+(e.zh||"")+"|"+(e.th||""); }
function isMarked(e){ return !!marks[mkKey(e)]; }
function toggleMark(e){
  const k=mkKey(e);
  if(marks[k]){ delete marks[k]; toast("已取消收藏 ☆"); }
  else {
    marks[k]={en:e.en||"",bm:e.bm||"",zh:e.zh||"",th:e.th||"",en_ipa:e.en_ipa||"",bm_ipa:e.bm_ipa||"",bm_pron:e.bm_pron||"",th_pron:e.th_pron||"",level:e.level||"",example:e.example||{}};
    toast("已收藏 ★ 可在测试器「我的收藏」中强化自测");
  }
  saveMarks();
}
/* 词根派生条目 -> 可标记的三元结构 */
function rootMarkEntry(e,langs){
  const t={en:"",bm:"",zh:"",th:"",en_ipa:"",bm_ipa:"",bm_pron:"",th_pron:"",level:"",example:{}};
  for(let p=0;p<3;p++){ const L=langs[p];
    if(L==="en") t.en=e.head[p]; else if(L==="bm") t.bm=e.head[p]; else if(L==="zh") t.zh=e.head[p]; else if(L==="th") t.th=e.head[p]; }
  return t;
}

let settings = {en:"",bm:"",zh:"",th:"",rate:1,gap:350,volume:1};
try{ Object.assign(settings, JSON.parse(localStorage.getItem(LS_SET)||"{}")); }catch(e){}
function saveSettings(){ try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }catch(e){} }

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; fillVoiceSelects(); }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

/* ===== 语音可用性提示（预览 webview 常不支持 TTS） ===== */
function showTtsBanner(ok, msg){
  let b=document.getElementById("ttsBanner");
  if(!b){ b=document.createElement("div"); b.id="ttsBanner"; b.className="ttsbanner"; document.body.appendChild(b); }
  if(ok){ b.style.display="none"; return; }
  b.style.display="block";
  b.innerHTML='⚠ <b>语音可能不可用：</b>'+(msg||"当前预览环境未接入系统语音合成引擎。")+
    ' 若点击「播放解说」听不到声音，请用 <b>Safari</b> 或 <b>Chrome</b> 浏览器打开本文件（双击文件即可），即可正常听到四语朗读。点「🔈 测试」可立刻验证。';
}
function testVoice(){
  if(!window.speechSynthesis){ toast("当前环境没有 Web Speech API，请用 Safari/Chrome 打开"); showTtsBanner(false,"当前环境没有 Web Speech API。"); return; }
  try{
    speechSynthesis.cancel();
    speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance("Hello, 你好, Selamat pagi, สวัสดี. 这是语音测试。");
    u.lang="zh-CN"; u.rate=1; u.volume=1;
    let started=false;
    const t=setTimeout(()=>{ if(!started) toast("⚠ 语音引擎无响应，请改用 Safari/Chrome 打开本文件"); }, 1200);
    u.onstart=()=>{ started=true; clearTimeout(t); toast("🔊 正在发声——若仍听不到，请检查系统音量/静音，或换 Safari/Chrome"); };
    u.onend=()=>{ started=true; clearTimeout(t); };
    u.onerror=()=>{ started=true; clearTimeout(t); toast("❌ 语音合成出错，请改用 Safari/Chrome 打开本文件"); showTtsBanner(false,"语音合成报错。"); };
    speechSynthesis.speak(u);
  }catch(e){ toast("语音初始化失败："+e.message); showTtsBanner(false,"语音初始化失败："+e.message); }
}
/* 保守探测：仅在明确无 API 时提示；有 API 但无声的情况靠「测试」按钮判断 */
if(!window.speechSynthesis){ showTtsBanner(false,"当前环境没有 Web Speech API。"); }
function fillVoiceSelects(){
  const mk=(sel,langPrefix,cur)=>{
    sel.innerHTML="";
    const opts = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(langPrefix));
    const all = document.createElement("option"); all.value=""; all.textContent="（自动/默认）"; sel.appendChild(all);
    opts.forEach(v=>{ const o=document.createElement("option"); o.value=v.name; o.textContent=v.name+" ["+v.lang+"]"; sel.appendChild(o); });
    sel.value = cur || (opts[0]?opts[0].name:"");
  };
  mk(document.getElementById("voiceEn"),"en",settings.en);
  mk(document.getElementById("voiceBm"),"ms",settings.bm);
  mk(document.getElementById("voiceZh"),"zh",settings.zh);
  mk(document.getElementById("voiceTh"),"th",settings.th);
  const bmNote=document.getElementById("bmNote");
  const hasBm = voices.some(v=>v.lang && v.lang.toLowerCase().startsWith("ms"));
  bmNote.textContent = hasBm ? "✓ 已检测到马来语嗓音" : "⚠ 本设备未安装马来语(ms-MY)嗓音，将回退默认嗓音。";
  const thNote=document.getElementById("thNote");
  const hasTh = voices.some(v=>v.lang && v.lang.toLowerCase().startsWith("th"));
  if(thNote){
    if(hasTh){ thNote.className="note ok"; thNote.textContent="✓ 已检测到泰语(th-TH)嗓音，可直接朗读。"; }
    else {
      thNote.className="note warn";
      thNote.innerHTML="⚠ <b>本设备未安装泰语语音包</b>，点击泰文/朗读将静音。开启方法：<br>"+
        "· Windows：设置→语音→添加“泰语”语言并下载语音包<br>"+
        "· macOS：系统设置→辅助功能→朗读内容→系统嗓音→管理嗓音→搜“Thai”下载<br>"+
        "· 安卓/iOS：安装“Google 文字转语音引擎”并在其设置里下载泰语语音包<br>"+
        "装好后重开本文件即可听到泰语朗读。";
    }
  }
}
function pickVoice(lang){
  const sel = lang==="en"?settings.en : lang==="bm"?settings.bm : lang==="zh"?settings.zh : settings.th;
  if(sel){ const v=voices.find(x=>x.name===sel); if(v) return v; }
  const pref = lang==="bm"?"ms":lang==="th"?"th":lang;
  const v = voices.find(x=>x.lang && x.lang.toLowerCase().startsWith(pref));
  return v || null;
}

const nav=document.getElementById("nav");

function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

let curSi=-1,curFi=-1;
function getUnitlist(){ return document.getElementById("unitlist"); }
function openFile(si,fi){
  curSi=si;curFi=fi;
  document.querySelectorAll(".navfile").forEach(b=>b.classList.remove("active"));
  const nb=nav.querySelector('.navfile[data-si="'+si+'"][data-fi="'+fi+'"]');

  f.units.forEach((u,ui)=>{
    const uu={si,fi,ui}; const d=isDone(uu);

    inner+='<div class="ucard'+(d?" done":"")+'" data-ui="'+ui+'">'+

  main.innerHTML='<div class="unitlist" id="unitlist">'+inner+'</div>';

let cur=null;
let playing=false, queue=[], qpos=0, paused=false, curRow=-1, curCol="";

      if(e.example.bm) sp+='<span class="ex ex-bm" data-text="'+escapeHtml(e.example.bm)+'" data-lang="bm">🇲🇾 '+escapeHtml(e.example.bm)+'</span>';
      if(e.example.zh) sp+='<span class="ex ex-zh" data-text="'+escapeHtml(e.example.zh)+'" data-lang="zh">🇨🇳 '+escapeHtml(e.example.zh)+'</span>';
      if(e.example.th) sp+='<span class="ex ex-th" data-text="'+escapeHtml(e.example.th)+'" data-lang="th">🇹🇭 '+escapeHtml(e.example.th)+'</span>';
      ex='<tr class="exrow" data-i="'+i+'"><td class="exwrap" colspan="'+cols+'">'+sp+'</td></tr>';
    }
    const mkd=isMarked(e);
    return '<tr id="row'+i+'" data-i="'+i+'">'+
      '<td class="c-mark"><span class="mark'+(mkd?" on":"")+'" data-i="'+i+'">'+(mkd?"★":"☆")+'</span></td>'+
      '<td class="c-en"><div class="t">'+escapeHtml(e.en||"")+'</div>'+(e.en_ipa?'<div class="ipa">'+escapeHtml(e.en_ipa)+'</div>':'')+'</td>'+
      '<td class="c-bm"><div class="t">'+escapeHtml(e.bm||"")+'</div>'+(e.bm_ipa?'<div class="ipa">'+escapeHtml(e.bm_ipa)+'</div>':'')+(e.bm_pron?'<div class="pron">'+escapeHtml(e.bm_pron)+'</div>':'')+'</td>'+
      '<td class="c-zh"><div class="t">'+escapeHtml(e.zh||"")+'</div></td>'+
      (hasTh?'<td class="c-th"><div class="t">'+escapeHtml(e.th||"")+'</div>'+(e.th_pron?'<div class="pron">'+escapeHtml(e.th_pron)+'</div>':'')+'</td>':'')+
      '<td class="c-lv">'+(e.level?escapeHtml(e.level):'')+'</td>'+
      '</tr>'+ex;
  }).join("");
  main.innerHTML='<div class="lesson">'+lessonBar('🔊 朗读汇总')+
    '<div class="tablewrap"><table class="vid"><thead><tr>'+
      '<th>★ 收藏</th><th>EN 英文</th><th>BM 马来文</th><th>ZH 中文</th>'+(hasTh?'<th>TH 泰文</th>':'')+'<th>难度</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      (u.summary?'<details class="notes"><summary>📝 原文详解 / 朗读文本</summary><div class="body">'+escapeHtml(u.summary)+(u.notes?("\n\n"+u.notes):"")+'</div></details>':'')+
    '</div></div>';
  document.getElementById("backBtn").onclick=()=>openFile(cur.si,cur.fi);
  document.getElementById("playBtn").onclick=togglePlay;
  document.getElementById("sumBtn").onclick=playSummary;
  document.getElementById("testBtn").onclick=testVoice;
  main.querySelectorAll("tbody tr").forEach(tr=>{ tr.onclick=()=>gotoRow(+tr.dataset.i); });
  main.querySelectorAll(".ex").forEach(sp=>{ sp.onclick=(ev)=>{ ev.stopPropagation(); speak(sp.dataset.text, sp.dataset.lang); }; });
  main.querySelectorAll(".mark").forEach(m=>{ m.onclick=(ev)=>{ ev.stopPropagation(); const e=entries[+m.dataset.i]; toggleMark(e); const on=isMarked(e); m.textContent=on?"★":"☆"; m.classList.toggle("on",on); }; });

function renderRoot(u){
  const langs=u.langs||["en","zh","bm"];
  const LNAME={en:"EN",zh:"中文",bm:"BM"};
  const LCOLOR={en:"l-en",zh:"l-zh",bm:"l-bm"};
  let html='<div class="lesson">'+lessonBar('🔊 词根串讲')+
    '<div class="rootwrap">'+
    '<div class="roothead"><div class="roottitle">'+escapeHtml(u.title)+'</div>'+
      (u.root_note?'<div class="rootnote">'+escapeHtml(u.root_note)+'</div>':'')+
    '</div><div class="derivlist">';
  (u.entries||[]).forEach((e,i)=>{
    let dhead='<div class="dhead">';
    e.head.forEach((h,p)=>{ dhead+='<span class="dw '+LCOLOR[langs[p]]+'">'+escapeHtml(h)+'</span><span class="langtag">'+LNAME[langs[p]]+'</span>'; });
    dhead+='</div>';
    let pron=[];
    if(e.ipa) pron.push(e.ipa);
    if(e.pinyin) pron.push("拼音 "+e.pinyin);
    if(e.bm_pron) pron.push(e.bm_pron);
    let ex='';
    if(e.example&&e.example.length){
      ex='<div class="dexample">';
      e.example.forEach((x,p)=>{ if(x) ex+='<div class="ex '+LCOLOR[langs[p]]+'" data-text="'+escapeHtml(x)+'" data-lang="'+langs[p]+'">'+escapeHtml(x)+'</div>'; });
      ex+='</div>';
    }
    const rm=rootMarkEntry(e,langs); const rmd=isMarked(rm);
    html+='<div class="derivcard" id="rcard'+i+'" data-i="'+i+'">'+
      '<span class="mark'+(rmd?" on":"")+'" data-i="'+i+'" style="position:absolute;top:12px;right:14px"> '+(rmd?"★":"☆")+'</span>'+
      dhead+
      (pron.length?'<div class="dpron">'+escapeHtml(pron.join(" ｜ "))+'</div>':'')+
      (e.base?'<div class="ddef">词根：'+escapeHtml(e.base)+'</div>':'')+
      (e.def?'<div class="ddef">释义：'+escapeHtml(e.def)+'</div>':'')+
      (e.phrase?'<div class="dphrase">短语：'+escapeHtml(e.phrase)+'</div>':'')+
      ex+
      '<button class="playone" data-i="'+i+'">▶ 播放此条</button>'+
    '</div>';
  });
  html+='</div>'+
    (u.summary||u.notes?'<details class="notes"><summary>📝 原文详解</summary><div class="body">'+escapeHtml((u.summary||"")+(u.notes?("\n\n"+u.notes):""))+'</div></details>':'')+
  '</div></div>';
  main.innerHTML=html;
  document.getElementById("backBtn").onclick=()=>openFile(cur.si,cur.fi);
  document.getElementById("playBtn").onclick=togglePlay;
  document.getElementById("sumBtn").onclick=playSummary;
  document.getElementById("testBtn").onclick=testVoice;
  main.querySelectorAll(".playone").forEach(b=>{ b.onclick=(ev)=>{ ev.stopPropagation(); gotoRow(+b.dataset.i); }; });
  main.querySelectorAll(".dexample .ex").forEach(sp=>{ sp.onclick=(ev)=>{ ev.stopPropagation(); speak(sp.dataset.text, sp.dataset.lang); }; });
  main.querySelectorAll(".mark").forEach(m=>{ m.onclick=(ev)=>{ ev.stopPropagation(); const e=cur.entries[+m.dataset.i]; const rm=rootMarkEntry(e,cur.langs); toggleMark(rm); const on=isMarked(rm); m.textContent=on?"★":"☆"; m.classList.toggle("on",on); }; });
  updateTimeline();
}

function buildQueue(){
  queue=[];
  if(!cur) return;
  if(cur.type==="root"){
    const langs=cur.langs||["en","zh","bm"];
    if(cur.root_note) queue.push({text:cur.root_note,lang:"zh",row:-1,intro:true});
    (cur.entries||[]).forEach((e,i)=>{
      for(let p=0;p<3;p++){
        if(e.head[p]) queue.push({text:e.head[p],lang:langs[p],row:i});
        if(e.example&&e.example[p]) queue.push({text:e.example[p],lang:langs[p],row:i});
      }
    });
  } else {
    (cur.entries||[]).forEach((e,i)=>{
      if(e.en) queue.push({text:e.en,lang:"en",row:i});
      if(e.bm) queue.push({text:e.bm,lang:"bm",row:i});
      if(e.zh) queue.push({text:e.zh,lang:"zh",row:i});
      if(e.th) queue.push({text:e.th,lang:"th",row:i});
      if(e.example){
        if(e.example.en) queue.push({text:e.example.en,lang:"en",row:i});
        if(e.example.bm) queue.push({text:e.example.bm,lang:"bm",row:i});
        if(e.example.zh) queue.push({text:e.example.zh,lang:"zh",row:i});
        if(e.example.th) queue.push({text:e.example.th,lang:"th",row:i});
      }
    });
  }
}
function togglePlay(){
  if(playing){ doPause(); return; }
  if(!window.speechSynthesis){ toast("当前浏览器不支持语音合成"); return; }
  try{ speechSynthesis.cancel(); }catch(e){} /* 清空可能卡住的残留队列，避免 Safari 静音 */
  if(queue.length===0 || qpos>=queue.length) buildQueue(), qpos=0;
  playing=true; paused=false;
  document.getElementById("playBtn").textContent="⏸ 暂停";
  playNext();
}
function doPause(){
  if(paused){ paused=false; speechSynthesis.resume(); document.getElementById("playBtn").textContent="⏸ 暂停"; }
  else{ paused=true; speechSynthesis.pause(); document.getElementById("playBtn").textContent="▶ 继续"; }
}
function playNext(){
  if(!playing) return;
  if(qpos>=queue.length){ finishPlay(); return; }
  const it=queue[qpos];
  highlight(it.row,it.lang);
  updateTimeline();
  speak(it.text,it.lang,()=>{
    if(!playing) return;
    const g=Math.max(settings.gap||0, 60); /* 最小间隔，规避 Chrome 连续朗读静音 bug */
    setTimeout(()=>{ if(playing) playNext(); }, g);
  });
}
function speak(text,lang,onend){
  if(!text){ if(onend) onend(); return; }
  const u=new SpeechSynthesisUtterance(text);
  u.lang = lang==="en"?"en-US":lang==="bm"?"ms-MY":lang==="zh"?"zh-CN":"th-TH";
  /* 仅在用户于设置中显式选定嗓音时才指定 voice；否则交给浏览器按 lang 自动选，
     避免指定不匹配/无效 voice 导致 Safari/WebKit 整句静音（测试按钮不设 voice 故有声音） */
  const sel = lang==="en"?settings.en : lang==="bm"?settings.bm : lang==="zh"?settings.zh : settings.th;
  if(sel){ const v=voices.find(x=>x.name===sel); if(v) u.voice=v; }
  u.rate=settings.rate||1;
  u.volume = (settings.volume!=null)?settings.volume:1;
  u.onend=()=>{ if(onend) onend(); };
  u.onerror=()=>{ if(onend) onend(); };
  try{ speechSynthesis.resume(); }catch(e){}
  speechSynthesis.speak(u);
}
function highlight(row,col){
  curRow=row; curCol=col;
  if(cur.type==="root"){
    main.querySelectorAll(".derivcard").forEach(c=>c.classList.remove("active","speak-en","speak-bm","speak-zh","speak-th"));
    if(row>=0){ const c=document.getElementById("rcard"+row); if(c){ c.classList.add("active","speak-"+col); c.scrollIntoView({block:"center",behavior:"smooth"}); } }
  } else {
    main.querySelectorAll("tbody tr").forEach(tr=>tr.classList.remove("active","speak-en","speak-bm","speak-zh","speak-th"));
    const tr=document.getElementById("row"+row);
    if(tr){ tr.classList.add("active","speak-"+col); tr.scrollIntoView({block:"center",behavior:"smooth"}); }
  }
  const nl=document.getElementById("nowlang");
  if(nl){ nl.className="nowlang "+col; nl.textContent= col==="en"?"🔵 英文":col==="bm"?"🟠 马来文":col==="zh"?"🟢 中文":"🟣 泰文"; }
}
function updateTimeline(){
  const total=queue.length||1;
  const pct=Math.min(100, Math.round(qpos/total*100));
  const tl=document.getElementById("timeline"); if(tl) tl.style.width=pct+"%";
}
function finishPlay(){
  playing=false; qpos=0;
  document.getElementById("playBtn").textContent="▶ 重新播放";
  const nl=document.getElementById("nowlang"); if(nl){ nl.className="nowlang"; nl.textContent="✓ 完成"; }
  if(cur.type==="root") main.querySelectorAll(".derivcard").forEach(c=>c.classList.remove("active","speak-en","speak-bm","speak-zh","speak-th"));
  else main.querySelectorAll("tbody tr").forEach(tr=>tr.classList.remove("active","speak-en","speak-bm","speak-zh","speak-th"));
  setDone(cur,true);
  toast("本单元解说完成，已标记 ✓ 已学");
}
function gotoRow(i){
  if(playing) return;
  if(cur.type==="root") speakOne(i); else speakRow(i);
}
function speakRow(i){
  curRow=i; highlight(i,"en");
  const e=cur.entries[i]; if(!e) return;
  const seq=[];
  if(e.en) seq.push(["en",e.en]); if(e.bm) seq.push(["bm",e.bm]); if(e.zh) seq.push(["zh",e.zh]); if(e.th) seq.push(["th",e.th]);
  let k=0;
  const step=()=>{ if(k>=seq.length) return; const [lang,txt]=seq[k++]; highlight(i,lang); speak(txt,lang,()=>setTimeout(step,Math.max(settings.gap||0,60))); };
  step();
}
function speakOne(i){
  curRow=i;
  const e=cur.entries[i]; if(!e) return;
  const langs=cur.langs; const seq=[];
  for(let p=0;p<3;p++){
    if(e.head[p]) seq.push([langs[p],e.head[p]]);
    if(e.example&&e.example[p]) seq.push([langs[p],e.example[p]]);
  }
  let k=0;
  const step=()=>{ if(k>=seq.length) return; const [lang,txt]=seq[k++]; highlight(i,lang); speak(txt,lang,()=>setTimeout(step,Math.max(settings.gap||0,60))); };
  step();
}
function stopPlay(){
  playing=false; paused=false; qpos=0;
  try{ speechSynthesis.cancel(); }catch(e){}
  const pb=document.getElementById("playBtn"); if(pb) pb.textContent="▶ 播放解说";
}
function stopPlaySilent(){ try{ speechSynthesis.cancel(); }catch(e){} playing=false; paused=false; qpos=0; }
function playSummary(){
  stopPlay();
  if(cur.type==="root"){ buildQueue(); qpos=0; playing=true; paused=false;
    document.getElementById("playBtn").textContent="⏸ 暂停"; playNext(); return; }
  if(!cur.summary){ toast("本单元无朗读汇总文本"); return; }
  const nl=document.getElementById("nowlang"); if(nl){ nl.className="nowlang"; nl.textContent="🔊 汇总"; }
  speak(cur.summary,"en",()=>{});
}

function refreshProgress(){
  const total=flat.length;
  const done=flat.filter(isDone).length;
  document.getElementById("progTxt").textContent=done+"/"+total;
  document.getElementById("progFill").style.width=(total?Math.round(done/total*100):0)+"%";
  if(curSi>=0&&curFi>=0) openFileRefresh();
}
function openFileRefresh(){
  const ul=getUnitlist(); if(!ul) return; /* lesson 视图下无 #unitlist，跳过 */
  ul.querySelectorAll(".ucard").forEach(c=>{
    const ui=+c.dataset.ui;
    const d=isDone({si:curSi,fi:curFi,ui});
    c.classList.toggle("done",d);
    const badge=c.querySelector(".badge"); if(badge) badge.textContent=d?"✓ 已学":"未学";
    const mini=c.querySelector(".mini>i"); if(mini) mini.style.width=d?100:0;
  });
}

const overlay=document.getElementById("overlay");
(function(btn){ if(btn) btn.onclick=()=>{ try{ if(!voices.length) loadVoices(); fillVoiceSelects(); }catch(e){} overlay.classList.add("show"); }; })(document.getElementById("settingsBtn"));
(function(btn){ if(btn) btn.onclick=()=>overlay.classList.remove("show"); })(document.getElementById("closeSettings"));
overlay.onclick=(e)=>{ if(e.target===overlay) overlay.classList.remove("show"); };
document.getElementById("voiceEn").onchange=e=>{settings.en=e.target.value;saveSettings();};
document.getElementById("voiceBm").onchange=e=>{settings.bm=e.target.value;saveSettings();};
document.getElementById("voiceZh").onchange=e=>{settings.zh=e.target.value;saveSettings();};

document.getElementById("testTh").onclick=()=>{
  if(!window.speechSynthesis){ toast("当前环境无 Web Speech API，请用 Safari/Chrome 打开"); return; }
  speechSynthesis.cancel(); speechSynthesis.resume();
  const u=new SpeechSynthesisUtterance("สวัสดี สบายดีไหม วันนี้อากาศดี");
  u.lang="th-TH"; const v=pickVoice("th"); if(v) u.voice=v; u.rate=1;
  u.onerror=()=>toast("❌ 泰语合成失败：本设备可能未安装泰语语音包，请见设置里的开启指引");
  speechSynthesis.speak(u);
};
document.getElementById("rate").oninput=e=>{settings.rate=+e.target.value;document.getElementById("rateTxt").textContent=(+e.target.value).toFixed(1);saveSettings();};
document.getElementById("gap").oninput=e=>{settings.gap=+e.target.value;saveSettings();};
document.getElementById("vol").oninput=e=>{settings.volume=+e.target.value;document.getElementById("volTxt").textContent=Math.round(+e.target.value*100);saveSettings();};
document.getElementById("rate").value=settings.rate; document.getElementById("rateTxt").textContent=(settings.rate||1).toFixed(1);
document.getElementById("gap").value=settings.gap;
document.getElementById("vol").value=(settings.volume!=null?settings.volume:1); document.getElementById("volTxt").textContent=Math.round((settings.volume!=null?settings.volume:1)*100);

document.addEventListener("keydown",e=>{
  if(overlay.classList.contains("show")) return;
  if(e.code==="Space" && cur && document.activeElement.tagName!=="SELECT"){
    e.preventDefault(); togglePlay();
  }else if(e.code==="ArrowRight" && cur){
    e.preventDefault(); if(curRow< (cur.entries.length-1)){ curRow++; gotoRow(curRow); }
  }else if(e.code==="ArrowLeft" && cur){
    e.preventDefault(); if(curRow>0){ curRow--; gotoRow(curRow); }
  }else if(e.code==="Escape" && cur){
    stopPlay(); openFile(cur.si,cur.fi);
  }
});

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200);
}

renderNav();
refreshProgress();
if(flat.length){ openFile(0,0); }

/* ===== 可折叠面板控制（目录 / 例句 / 顶栏），状态持久化 ===== */
function toggleLayout(kind){
  const cls={sidebar:'hide-sidebar',examples:'hide-examples',topbar:'hide-topbar'}[kind];
  if(!cls) return;
  document.body.classList.toggle(cls);
  const on=!document.body.classList.contains(cls);
  document.querySelectorAll('[data-layout="'+kind+'"]').forEach(b=>b.classList.toggle('on',on));
  try{ localStorage.setItem('layout_'+kind, on?'1':'0'); }catch(e){}
}
function applyLayout(){
  ['sidebar','examples','topbar'].forEach(kind=>{
    let v='1'; try{ v=localStorage.getItem('layout_'+kind)||'1'; }catch(e){}
    const on = v!=='0';
    const cls={sidebar:'hide-sidebar',examples:'hide-examples',topbar:'hide-topbar'}[kind];
    document.body.classList.toggle(cls, !on);
    document.querySelectorAll('[data-layout="'+kind+'"]').forEach(b=>b.classList.toggle('on', on));
  });
}
document.querySelectorAll('[data-layout]').forEach(b=>{ b.onclick=()=>toggleLayout(b.dataset.layout); });
applyLayout();

<script>
(function(){
  var KEY="tril_auth_v1", SKEY="tril_auth_sess_v1";
  function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function L(){try{return JSON.parse(g(KEY))||null}catch(e){return null}}
  function Sv(o){s(KEY,JSON.stringify(o))}
  var a=L();
  if(!a){a={user:"bi6099445",pass:"123456",reminder:"12",changed:false};Sv(a);}
  var ov=document.getElementById("authOverlay"),gear=document.getElementById("authGear"),modal=document.getElementById("authSettings"),errEl=document.getElementById("authErr");
  function showApp(){ov.style.display="none";gear.style.display="block";}
  function showLogin(){ov.style.display="flex";gear.style.display="none";}
  if(g(SKEY)==="1"){showApp();}else{showLogin();}
  document.getElementById("authLogin").onclick=function(){
    var u=document.getElementById("authUser").value.trim();
    var p=document.getElementById("authPass").value;
    if(u===a.user&&p===a.pass){s(SKEY,"1");errEl.textContent="";showApp();}
    else{errEl.textContent="账号或密码错误";}
  };
  document.getElementById("authPass").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("authLogin").click();});
  document.getElementById("authForgot").onclick=function(){alert("密码提醒："+(a.reminder||"（未设置）")+"\n账号："+a.user);};
  document.getElementById("authOpenSet").onclick=function(){modal.style.display="flex";document.getElementById("setErr").textContent="";};
  gear.onclick=function(){modal.style.display="flex";document.getElementById("setErr").textContent="";};
  document.getElementById("setCancel").onclick=function(){modal.style.display="none";};
  document.getElementById("setSave").onclick=function(){
    var old=document.getElementById("setOld").value,nw=document.getElementById("setNew").value,nw2=document.getElementById("setNew2").value,rem=document.getElementById("setRem").value;
    var e=document.getElementById("setErr");
    if(old!==a.pass){e.textContent="当前密码不正确";return;}
    if(!/^\d{6}$/.test(nw)){e.textContent="新密码必须是6位数字";return;}
    if(nw!==nw2){e.textContent="两次输入的新密码不一致";return;}
    if(rem.length!==2){e.textContent="密码提醒需为2位（数字或字符）";return;}
    a.pass=nw;a.reminder=rem;a.changed=true;Sv(a);
    e.style.color="#16a34a";e.textContent="已保存";
    setTimeout(function(){modal.style.display="none";e.style.color="#dc2626";},900);
  };
})();
</script><script>
