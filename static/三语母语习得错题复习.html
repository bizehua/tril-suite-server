<html lang="zh-CN">
<head>

<script src="tril-skin.js"></script>
<script src="tril-skin-widget.js"></script>

<title>四语错题专练</title>
<style>
:root{
  --bg:#0e1320; --bg2:#151c2e; --panel:#1a2238; --panel2:#212c47;
  --line:#2c3756; --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  --en:#5b8cff; --bm:#ffb454; --zh:#4fd1a5; --th:#c792ea; --danger:#ff6b6b;
  --ok:#4fd1a5; --warn:#ffb454; --bad:#ff6b6b;
  --glow:0 0 0 2px rgba(255,107,107,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#1a0f12,#0e1320);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(28,16,20,.85);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{font-size:11px;color:var(--muted)}
header .spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 12px;font-size:13px;
  background:var(--panel2);color:var(--txt);transition:.15s;border:1px solid var(--line);min-height:40px}
button:hover{background:var(--btn-hover)}
button.primary{background:linear-gradient(90deg,var(--bad),var(--warn));border:none;font-weight:700;color:#fff}
button.ghost{background:transparent}
button.active{background:var(--bad);color:#fff;border-color:var(--bad)}
button.r-rm{background:rgba(79,209,165,.18);border-color:var(--ok);color:#c5f3e3}
button.r-rm:hover{background:rgba(79,209,165,.32)}
button.r-keep{background:rgba(255,180,84,.18);border-color:var(--warn);color:#ffe6c1}
button.r-keep:hover{background:rgba(255,180,84,.32)}
button.r-bad{background:rgba(255,107,107,.18);border-color:var(--danger);color:#ffd0d0}
button.r-bad:hover{background:rgba(255,107,107,.32)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;color:var(--muted)}
.chip strong{color:var(--txt);font-weight:700}

main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sc .lbl{font-size:11px;color:var(--muted)}
.sc .val{font-size:22px;font-weight:700;margin-top:2px}
.sc .val.ok{color:var(--ok)}
.sc .val.bad{color:var(--bad)}
.sc .val.warn{color:var(--warn)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:11px;color:var(--muted);margin-right:2px}
.filters button{padding:6px 10px;font-size:12px;min-height:32px}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
.card{width:min(560px,100%);min-height:420px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer}
.card.danger{border-color:var(--danger);box-shadow:0 0 0 1px rgba(255,107,107,.18),0 8px 28px rgba(0,0,0,.35)}
.card .corner{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.card .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .front-en{font-size:36px;font-weight:700;color:var(--en);line-height:1.2;text-align:center;margin:auto 0;letter-spacing:.5px}
.card .front-ipa{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px}
.card .back{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.card .back.hidden{display:none}
.card .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .row .lbl{min-width:34px;font-size:12px;color:var(--muted);text-align:right}
.card .row .val{font-size:18px;font-weight:600;line-height:1.4;flex:1}
.card .row .py{font-size:11px;color:var(--muted)}
.streakbar{display:flex;gap:3px;justify-content:center;margin-top:6px}
.streakbar i{display:block;width:16px;height:6px;border-radius:3px;background:var(--line)}
.streakbar i.on{background:linear-gradient(90deg,var(--ok),#6ee7b7)}

.rate{display:grid;grid-template-columns:1.4fr 1fr 1fr 0.7fr;gap:8px;margin-top:14px}
.rate button{font-weight:700;font-size:14px;min-height:54px}
.rate.hidden{display:none}

.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.empty h2{color:var(--txt);font-size:18px;margin:0 0 8px}
.empty p{font-size:13px;line-height:1.7;margin:6px 0}
.empty .hint{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;margin:14px auto;max-width:480px;font-size:13px}
.empty .hint b{color:var(--bad)}

.foot{padding:8px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:rgba(28,16,20,.7)}
.progress{flex:1;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn));transition:width .25s}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .rate{grid-template-columns:1fr 1fr;gap:6px}
  .rate button.skip{margin-top:6px}
  .card .front-en{font-size:28px}
  header h1{font-size:14px}
}
</style>

<div id="layoutDock">

  <button class="ghost danger" onclick="if(confirm('确定清空错题本？（不可恢复）')){localStorage.removeItem('tril_wrongbook_v1');location.reload();}">🗑</button>
</div>

<div id="trilSpinner" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1320;color:#93a0bd;z-index:99999;font:14px system-ui">⏳ 正在加载词库…</div>

<script src="tril-db.js"></script>
<script src="tril-migrate.js"></script>
<script src="tril-csv.js"></script>
<script src="三语母语习得核心词库.index.js"></script>
<script src="tril-core.js"></script>
<script src="tril-lib.js"></script>
<script src="pinyin-pro.min.js"></script>
<script src="tril-pinyin.js"></script>
<script>
"use strict";

const LS_WRONG = "tril_wrongbook_v1";
const STORAGE_FALLBACK_KEYS = [];  // (refreshed from IDB migration below)

let wrongbook = {};
try{ wrongbook = JSON.parse(localStorage.getItem(LS_WRONG) || "{}") || {}; }catch(e){ wrongbook = {}; }

function saveWrongbook(){
  try{ localStorage.setItem(LS_WRONG, JSON.stringify(wrongbook)); }
  catch(e){
    if(window.TrilDB){
      // fallback: IDB 直接写
      TrilDB.set("wrongbook", wrongbook).catch(function(){});
    }
  }
}

function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function toast(msg){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;z-index:99998;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4)";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1700);
}

function goHome(){
  // 三器选择页相对路径（与本文件同目录）
  if(document.referrer && /tril-suite-server|index\.html/i.test(document.referrer)){ history.back(); return; }
  location.href = "index.html";
}

/* ============ 入口聚合：从 IDB 拿全量 wrongbook ============ */
function loadWrongbookAsync(){
  return new Promise(function(resolve){
    var done = false;
    function finish(v){ if(done) return; done = true; resolve(v || wrongbook); }

    // 1) localStorage 同步值（已在脚本顶部读好）
    var lsVal = wrongbook;

    // 2) IDB 异步值
    if(window.TrilDB){
      TrilDB.open().then(function(){
        return TrilDB.get("wrongbook");
      }).then(function(v){
        if(v && typeof v === "object"){
          // 以 IDB 为准（更全），并写回 LS
          Object.keys(v).forEach(function(k){
            if(!lsVal[k]) lsVal[k] = v[k];
          });
          wrongbook = Object.assign({}, v, lsVal);
          saveWrongbook();
          finish(wrongbook);
        } else {
          finish(lsVal);
        }
      }).catch(function(){ finish(lsVal); });
    } else {
      finish(lsVal);
    }
  });
}

/* ============ TTS ============ */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, lang, onend){
  if(!text){ if(onend) onend(); return; }
  if(!window.speechSynthesis){ return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang==="en"?"en-US":lang==="bm"?"ms-MY":lang==="zh"?"zh-CN":"th-TH";
  u.rate = 1; u.volume = 1;
  u.onend = () => { if(onend) onend(); };
  u.onerror = () => { if(onend) onend(); };
  try{ speechSynthesis.resume(); }catch(e){}
  speechSynthesis.speak(u);
}

/* ============ 队列：按 wrong ↓ + streak ↑ 排序 ============ */
let queue = [];
let pos = -1;
let flipped = false;
let sortMode = "wrong";   // "wrong" | "recent" | "alpha"
let filterMode = "all";   // "all" | "high" | "new" | "almost" | "unit"
let unitFilter = null;    // {si, fi, ui} — fi/ui 为 null 表示整文件/整学段；si=-1 表示未匹配词库的词
let srcMap = null;        // key → {si,fi,ui,stage,unit}（词库后台加载完成后可用）
let libStages = null;     // [{name, files:[{name, units:[...]]}]（选择器用）

/* ============ 词库后台渐进加载（用于「按单元」过滤的 key→单元映射） ============ */
(function loadLibInBackground(){
  if(!window.TrilCore) return;
  TrilCore.loadAll().then(function(data){
    if(!data || !data.length) return;
    const wrapped = {stages: data};
    if(window.TrilLib) TrilLib.mergeStages(wrapped);
    libStages = wrapped.stages;
    const map = {};
    wrapped.stages.forEach(function(st, si){
      (st.files||[]).forEach(function(f, fi){
        (f.units||[]).forEach(function(u, ui){
          (u.entries||[]).forEach(function(e){
            if(!e) return;
            const k = (e.en||"")+"|"+(e.bm||"")+"|"+(e.zh||"")+"|"+(e.th||"");
            if(!map[k]) map[k] = {si:si, fi:fi, ui:ui, stage:st.name, unit:u.title||("Unit "+(ui+1))};
          });
        });
      });
    });
    srcMap = map;
    // 词库就绪 → 刷新侧栏目录
    renderNav();
    // 若当前处于「按单元」过滤但之前词库未就绪，重建队列
    if(filterMode === "unit" && unitFilter) buildQueueAndRender();
  }).catch(function(){});
})();

function unitWrongCounts(){
  // 各单元（含学段/文件层级聚合）的错词数
  const perUnit = {};    // "si|fi|ui" → n
  const perFile = {};    // "si|fi" → n
  const perStage = {};   // "si" → n
  const unmatched = {n:0};
  if(srcMap){
    Object.keys(wrongbook).forEach(function(k){
      const s = srcMap[k];
      if(!s){ unmatched.n++; return; }
      const uk = s.si+"|"+s.fi+"|"+s.ui;
      perUnit[uk] = (perUnit[uk]||0)+1;
      const fk = s.si+"|"+s.fi;
      perFile[fk] = (perFile[fk]||0)+1;
      perStage[s.si] = (perStage[s.si]||0)+1;
    });
  }
  return {perUnit:perUnit, perFile:perFile, perStage:perStage, unmatched:unmatched.n};
}

function sortAndFilter(){
  let arr = Object.keys(wrongbook).map(k => ({key: k, entry: wrongbook[k]}));
  // 过滤
  if(filterMode === "unit" && unitFilter){
    const f = unitFilter;
    if(f.si === -1){
      // 未匹配词库的错词
      arr = arr.filter(it => !srcMap || !srcMap[it.key]);
    } else if(srcMap){
      arr = arr.filter(it => {
        const s = srcMap[it.key];
        if(!s) return false;
        if(s.si !== f.si) return false;
        if(f.fi != null && s.fi !== f.fi) return false;
        if(f.ui != null && s.ui !== f.ui) return false;
        return true;
      });
    }
    /* srcMap 未就绪时不过滤（保持全部） */
  } else if(filterMode === "high"){
    arr = arr.filter(it => (it.entry.wrong || 0) >= 3);
  } else if(filterMode === "new"){
    // streak=0 且 wrong≥2 → 重新洗牌的「重点」用户
    arr = arr.filter(it => (it.entry.streak || 0) === 0 && (it.entry.wrong || 0) >= 2);
  } else if(filterMode === "almost"){
    // 连对 ≥ 5、接近毕业的
    arr = arr.filter(it => (it.entry.streak || 0) >= 5);
  }
  // 排序：错得越多越靠前；同样错次数时按连对升序（接近毕业往后挪）
  arr.sort((a, b) => {
    if(sortMode === "recent"){
      return (b.entry.updated_at || 0) - (a.entry.updated_at || 0);
    }
    if(sortMode === "alpha"){
      return (a.entry.en || "").localeCompare(b.entry.en || "");
    }
    // default: "wrong"
    const wa = a.entry.wrong || 0, wb = b.entry.wrong || 0;
    if(wb !== wa) return wb - wa;
    const sa = a.entry.streak || 0, sb = b.entry.streak || 0;
    return sa - sb;
  });
  return arr;
}

function buildQueueAndRender(){
  queue = sortAndFilter();
  pos = -1;
  renderCard();   // 先渲染第一张卡片/空态/总结
  render();       // 再挂过滤器条 + 顶栏统计（filter 是 main.firstChild，不被 renderCard 覆盖）
}

/* ============ UI 渲染 ============ */
function renderEmpty(){
  const main = document.getElementById("main");
  main.innerHTML = '<div class="empty">' +
    '<h2>🎉 错题本空空如也</h2>' +
    '<p>所有错词都已掌握。继续保持！</p>' +
    '<div class="hint">' +
    '<p>① 在 <b>测试器</b>答错的词会自动收进错题本</p>' +
    '<p>② 在 <b>闪记</b>给 ✗ 不认识 的词也会进来</p>' +
    '<p>③ 在 <b>主复习</b> 评级为 ✗ 不认识 的词 → SRS 重置后也会入错题本</p>' +
    '<p>本页面按 <b>错得越多 → 越靠前</b> 排序，连对 10 次自动毕业。</p>' +
    '</div>' +
    '<div style="margin-top:18px">' +
    '<button class="primary" onclick="location.href=\'三语母语习得复习.html\'">🔁 去主复习</button> ' +
    '<button onclick="location.href=\'三语母语习得测试器.html\'">📝 去测试器</button>' +
    '</div>' +
    '</div>';
  document.getElementById("progFill").style.width = "0%";
  document.getElementById("footChip").textContent = "无任务";
}

function exLine(lbl, val, lang){
  if(!val) return '';
  return '<div class="row"><span class="lbl" style="font-size:10px">' + lbl + '</span>' +
    '<div class="val" style="font-weight:400;font-size:13px;cursor:pointer" onclick="event.stopPropagation();speak(\'' +
    String(val).replace(/'/g, "\\'") + '\',\'' + lang + '\')" title="点击朗读">' + escapeHtml(val) + '</div></div>';
}

function renderCard(){
  const main = document.getElementById("main");
  if(queue.length === 0){ renderEmpty(); return; }
  if(pos >= queue.length){
    renderSummary();
    return;
  }
  if(pos < 0) pos = 0;

  const it = queue[pos];
  const e = it.entry;
  const wrong = e.wrong || 0;
  const streak = Math.min(10, e.streak || 0);
  const danger = wrong >= 3 ? "danger" : "";

  let streakHtml = '';
  for(let i = 0; i < 10; i++){
    streakHtml += '<i class="' + (i < streak ? 'on' : '') + '"></i>';
  }

  const ex = (typeof e.example === "object" && e.example) ? e.example : {};
  const exHtml = (ex.en || ex.bm || ex.zh || ex.th) ? (
    '<div class="row examples-row" style="margin-top:4px"><span class="lbl">例句</span>' +
    '<div class="val" style="font-weight:400;font-size:13px;display:flex;flex-direction:column;gap:3px">' +
      exLine("EN", ex.en, "en") +
      exLine("BM", ex.bm, "bm") +
      exLine("ZH", ex.zh, "zh") +
      exLine("TH", ex.th, "th") +
    '</div></div>'
  ) : '';

  const card = document.createElement("div");
  card.className = "card " + danger;
  card.innerHTML =
    '<div class="corner">' +
      '<span class="chip" style="border-color:var(--danger)">' +
        '错 <strong style="color:#ffd0d0">' + wrong + '</strong>' +
      '</span>' +
    '</div>' +
    '<div class="meta">' +
      '<span class="chip">第 ' + (pos+1) + '/' + queue.length + ' 张</span>' +
      '<span class="chip">连对 ' + streak + '/10</span>' +
      '<span class="spacer" style="flex:1"></span>' +
      (e.level ? '<span class="chip">L' + escapeHtml(String(e.level)) + '</span>' : '') +
    '</div>' +
    frontHtmlByLang(e) +
    '<div class="streakbar" title="连对 10 自动毕业">' + streakHtml + '</div>' +
    '<div class="back ' + (flipped ? '' : 'hidden') + '">' +
      backRowHtml("英文", e.en, e.en_ipa, "en") +
      backRowHtml("马来", e.bm, e.bm_pron || e.bm_ipa, "bm") +
      backRowHtml("中文", e.zh, e.zh_pinyin, "zh") +
      backRowHtml("泰文", e.th, e.th_pron, "th") +
      exHtml +
    '</div>' +
    '<div class="rate ' + (flipped ? '' : 'hidden') + '">' +
      '<button class="r-bad" onclick="event.stopPropagation();rate(\'reset\')">✗ 完全陌生<br><span style="font-size:11px;opacity:.7">错+' + (wrong+1) + ' · 回到队首</span></button>' +
      '<button class="r-keep" onclick="event.stopPropagation();rate(\'keep\')">? 还在练<br><span style="font-size:11px;opacity:.7">连对+' + (streak+1) + '</span></button>' +
      '<button class="r-rm" onclick="event.stopPropagation();rate(\'mastered\')">✓ 记住了<br><span style="font-size:11px;opacity:.7">从错题本移除</span></button>' +
      '<button class="skip ghost" onclick="event.stopPropagation();skip()" title="跳过不改错题本">⏭</button>' +
    '</div>';

  card.onclick = (ev) => {
    if(!flipped){ flipped = true; renderCard(); }
  };

  main.innerHTML = '';
  main.appendChild(card);

  setTimeout(()=>{ autoSpeakFront(e); }, 80);

  const pct = queue.length ? Math.round((pos) / queue.length * 100) : 0;
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("footChip").textContent = (pos+1) + " / " + queue.length + " · 余 " + (queue.length - pos);
}

function rowHtml(label, val, phonetic, lang){
  if(!val) return '';
  var valEsc = escapeHtml(val);
  /* 中文 fallback：若 e.zh_pinyin 缺失，用 TrilPinyin 运行时生成 */
  var valPron = phonetic ? '<span class="py"> · ' + escapeHtml(phonetic) + '</span>' : '';
  if(lang === "zh" && !phonetic && window.TrilPinyin){
    valPron = '<span class="py"> · ' + window.TrilPinyin.get(val) + '</span>';
  }
  var py = (lang === "zh" && window.TrilPinyin) ? TrilPinyin.html(val) : '';
  var safeVal = String(val).replace(/'/g, "\\'");
  var btn = '<button class="ghost row-spk" onclick="event.stopPropagation();speak(\'' + safeVal + '\',\'' + (lang||"en") + '\')" title="朗读 ' + label + '">🔊</button>';
  return '<div class="row lang-' + (lang||'en') + '"><span class="lbl">' + label + '</span><div class="val">' + valEsc + valPron + py + btn + '</div></div>';
}

function renderSummary(){
  const main = document.getElementById("main");
  let removed = 0, kept = 0, reset = 0;
  Object.keys(wrongbook).forEach(k => {
    const e = wrongbook[k];
    if(!e) return;
    if(!e.history) return;
    e.history.forEach(h => {
      if(h.action === "mastered") removed++;
      else if(h.action === "keep") kept++;
      else if(h.action === "reset") reset++;
    });
  });
  main.innerHTML = '<div class="empty">' +
    '<h2>🎉 本轮错题专练完成</h2>' +
    '<p>本轮操作：<b style="color:var(--ok)">✓ 移出 ' + removed + '</b> · <b style="color:var(--warn)">? 还在练 ' + kept + '</b> · <b style="color:var(--bad)">✗ 重置 ' + reset + '</b></p>' +
    '<div class="hint">' +
    '<p>还剩 <b>' + Object.keys(wrongbook).length + '</b> 个词在错题本里。</p>' +
    '<p>排序策略：错得越多越靠前 → 头几个永远是「顽固词」。</p>' +
    '</div>' +
    '<div style="margin-top:18px">' +
    '<button class="primary" onclick="buildQueueAndRender()" style="margin-right:8px">⟲ 再来一轮</button>' +
    '<button onclick="location.href=\'三语母语习得复习.html\'">🔁 去主复习</button>' +
    '</div>' +
    '</div>';
  document.getElementById("progFill").style.width = "100%";
  document.getElementById("footChip").textContent = "完成 ✓";
}

function updateHeaderStats(){
  const keys = Object.keys(wrongbook);
  const total = keys.length;
  const heavy = keys.filter(k => (wrongbook[k].wrong || 0) >= 3).length;
  const almost = keys.filter(k => (wrongbook[k].streak || 0) >= 5).length;
  const mastered = keys.filter(k => !wrongbook[k] || (wrongbook[k].streak || 0) >= 10).length;
  document.getElementById("queueChip").innerHTML = '<strong>' + total + '</strong> 总 · <strong>' + heavy + '</strong> 顽固 · <strong>' + almost + '</strong> 接近';

try{ filtersCollapsed = localStorage.getItem('tril_filter_collapsed_v1') === '1'; }catch(e){}

/* ============ 📖 按单元选择错词范围 ============ */
function unitFilterLabel(){
  if(!unitFilter) return "";
  if(unitFilter.si === -1) return "未匹配词库的词";
  if(!libStages || !libStages[unitFilter.si]) return "已选单元";
  const st = libStages[unitFilter.si];
  let name = st.name;
  if(unitFilter.fi != null && st.files && st.files[unitFilter.fi]){
    name += " › " + st.files[unitFilter.fi].name;
    if(unitFilter.ui != null && st.files[unitFilter.fi].units && st.files[unitFilter.fi].units[unitFilter.ui]){
      name += " › " + (st.files[unitFilter.fi].units[unitFilter.ui].title || "");
    }
  }
  return name;
}

/* ============ 📚 3 级钻取式目录（学段 → 文件 → 单元，仅显示有错词的范围） ============ */
const nav = document.getElementById("nav");
const navState = {level:1, si:-1, fi:-1, hist:[]};
function mkBack(txt){
  const b = document.createElement("button");
  b.className = "navback";
  b.textContent = txt;
  b.onclick = navBack;
  return b;
}
function goLevel(level, si, fi){
  navState.hist.push({level:navState.level, si:navState.si, fi:navState.fi});
  navState.level = level; navState.si = si; navState.fi = fi;
  renderNav();
}
function navBack(){
  if(!navState.hist.length) return;
  const p = navState.hist.pop();
  navState.level = p.level; navState.si = p.si; navState.fi = p.fi;
  renderNav();
}
function sortedStages(){
  /* 东钢岗位词汇 永远在第一位 */
  if(!libStages) return [];
  const a = libStages.slice();
  const i = a.findIndex(s => /东钢岗位词汇/.test(s.name || ""));
  if(i > 0){ const x = a.splice(i, 1)[0]; a.unshift(x); }
  return a;
}
function renderNav(){
  if(!nav) return;
  nav.innerHTML = "";
  /* 顶部：当前范围 */
  const top = document.createElement("div");
  top.style.cssText = "padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px";
  const curLabel = unitFilter ? ("📍 " + unitFilterLabel()) : "📍 全部错词";
  top.innerHTML = '<div style="font-size:11.5px;color:var(--muted);margin-bottom:5px">' + escapeHtml(curLabel) + '</div>' +
    '<button class="navfile" onclick="clearUnitFilter()" style="font-size:11.5px;padding:4px 8px">🔄 回到全部错词</button>';
  nav.appendChild(top);

  if(!libStages){
    const ph = document.createElement("div");
    ph.style.cssText = "padding:14px 6px;font-size:12px;color:var(--muted);text-align:center";
    ph.innerHTML = "⏳ 词库后台加载中…<br><span style='font-size:11px'>首次约 30MB，之后走本地缓存。</span>";
    nav.appendChild(ph);
    return;
  }

  if(navState.level === 1){
    const cnt = unitWrongCounts();
    let any = false;
    sortedStages().forEach(st => {
      const si = libStages.indexOf(st);
      const sc = cnt.perStage[si] || 0;
      if(!sc) return;
      any = true;
      const b = document.createElement("button");
      b.className = "navfile";
      b.innerHTML = "▸ " + escapeHtml(st.name) + ' <span class="fc" style="color:var(--danger)">' + sc + ' 错词</span>';
      b.onclick = () => goLevel(2, si, -1);
      nav.appendChild(b);
    });
    /* 未匹配词库的错词 */
    if(cnt.unmatched){
      any = true;
      const b = document.createElement("button");
      b.className = "navfile";
      b.innerHTML = '❓ 未匹配词库的错词 <span class="fc" style="color:var(--danger)">' + cnt.unmatched + ' 词</span>';
      b.onclick = () => pickUnit(-1, null, null);
      nav.appendChild(b);
    }
    if(!any){
      const ph = document.createElement("div");
      ph.style.cssText = "padding:14px 6px;font-size:12px;color:var(--muted);text-align:center";
      ph.innerHTML = "📭 词库中未找到任何错词的归属单元。<br><span style='font-size:11px'>（错词可能来自自定义词库或导入）</span>";
      nav.appendChild(ph);
    }
  } else if(navState.level === 2){
    const st = libStages[navState.si];
    if(!st){ navBack(); return; }
    nav.appendChild(mkBack("◀ 返回学段"));
    const cnt = unitWrongCounts();
    const sc = cnt.perStage[navState.si] || 0;
    /* 整个学段专练 */
    const allBtn = document.createElement("button");
    allBtn.className = "navunit";
    allBtn.innerHTML = "🔁 专练整个学段 <span class='fc' style='color:var(--danger)'>" + sc + " 错词</span>";
    allBtn.onclick = () => pickUnit(navState.si, null, null);
    nav.appendChild(allBtn);
    /* 文件列表 */
    (st.files || []).forEach((f, fi) => {
      const fc = cnt.perFile[navState.si + "|" + fi] || 0;
      if(!fc) return;
      const b = document.createElement("button");
      b.className = "navfile";
      b.innerHTML = "▸ " + escapeHtml(f.name) + ' <span class="fc" style="color:var(--danger)">' + fc + ' 错词</span>';
      b.onclick = () => goLevel(3, navState.si, fi);
      nav.appendChild(b);
    });
  } else {
    /* level===3：单元列表 */
    const st = libStages[navState.si];
    if(!st){ navBack(); return; }
    const f = st.files[navState.fi];
    if(!f){ navBack(); return; }
    nav.appendChild(mkBack("◀ 返回文件"));
    const cnt = unitWrongCounts();
    const fc = cnt.perFile[navState.si + "|" + navState.fi] || 0;
    /* 整个文件专练 */
    const allBtn = document.createElement("button");
    allBtn.className = "navunit";
    allBtn.innerHTML = "🔁 专练整个文件 <span class='fc' style='color:var(--danger)'>" + fc + " 错词</span>";
    allBtn.onclick = () => pickUnit(navState.si, navState.fi, null);
    nav.appendChild(allBtn);
    /* 单元列表 */
    (f.units || []).forEach((u, ui) => {
      const uc = cnt.perUnit[navState.si + "|" + navState.fi + "|" + ui] || 0;
      if(!uc) return;
      const b = document.createElement("button");
      b.className = "navunit";
      b.innerHTML = "📕 " + escapeHtml(u.title || ("Unit " + (ui+1))) + ' <span class="fc" style="color:var(--danger)">' + uc + ' 错词</span>';
      b.onclick = () => pickUnit(navState.si, navState.fi, ui);
      nav.appendChild(b);
    });
  }
}
function pickUnit(si, fi, ui){
  unitFilter = {si: si, fi: fi, ui: ui};
  filterMode = "unit";
  buildQueueAndRender();
  /* 选完回 level 1（顶栏显示「📍 当前范围」） */
  while(navState.hist.length) navState.hist.pop();
  navState.level = 1; navState.si = -1; navState.fi = -1;
  renderNav();
  toast("📖 已选择：" + unitFilterLabel());
}
function clearUnitFilter(){
  unitFilter = null;
  filterMode = "all";
  buildQueueAndRender();
  renderNav();
}

function rate(action){
  if(pos < 0 || pos >= queue.length) return;
  const it = queue[pos];
  const e = it.entry;
  if(!e.history) e.history = [];

  const beforeStreak = e.streak || 0;

  if(action === "mastered"){
    // 从错题本移除
    delete wrongbook[it.key];
    e.history.push({action:"mastered", at: Date.now()});
    toast("✓ 已从错题本移除");
  } else if(action === "keep"){
    // 连对 +1
    e.streak = beforeStreak + 1;
    e.updated_at = Date.now();
    e.history.push({action:"keep", at: Date.now()});
    if(e.streak >= 10){
      // 自动毕业：移除
      delete wrongbook[it.key];
      toast("🎉 连对 10 次，自动毕业移出错题本！");
    }
  } else if(action === "reset"){
    // 错误重置：wrong += 1, streak = 0；该词回到队首
    e.wrong = (e.wrong || 0) + 1;
    e.streak = 0;
    e.updated_at = Date.now();
    e.history.push({action:"reset", at: Date.now()});
    // 把它插入到下一张位置（队首之后）
    queue.splice(pos + 1, 0, it);
    toast("✗ 标记完全陌生，回到队首复习");
  }

  if(wrongbook[it.key]) saveWrongbook();

  flipped = false;
  pos++;
  renderCard();
  updateHeaderStats();
}

function skip(){
  flipped = false;
  pos++;
  renderCard();
}

function render(){
  updateHeaderStats();
  renderFilters();
}

/* ============ 导出 / 导入 ============ */
function exportWrong(){
  const data = {v:1, exported_at:new Date().toISOString(), wrongbook: wrongbook};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tril_wrongbook_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast("已导出错题本");
}
function exportWrongTSV(){
  if(!window.trilCSV){ toast("CSV 模块未加载"); return; }
  const rows = Object.keys(wrongbook).map(k=>wrongbook[k]).filter(e=>e && (e.en||e.bm||e.zh||e.th));
  const x = trilCSV.exportEntries(rows, "tril_wrongbook_" + new Date().toISOString().slice(0,10) + ".tsv");
  toast("已导出 " + x + " 条 → TSV");
}
function importWrong(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data || !data.wrongbook) throw new Error("invalid");
      const merged = Object.assign({}, wrongbook, data.wrongbook);
      wrongbook = merged;
      saveWrongbook();
      buildQueueAndRender();
      toast("已导入 " + Object.keys(data.wrongbook).length + " 条");
    }catch(e){ toast("导入失败：" + e.message); }
  };
  r.readAsText(f);
  ev.target.value = "";
}

/* ============ 顶栏 / 目录 显示切换（与学习器 / 测试器统一） ============ */
function toggleLayout(kind){
  const cls={sidebar:'hide-sidebar',topbar:'hide-topbar'}[kind];
  if(!cls) return;
  document.body.classList.toggle(cls);
  const on=!document.body.classList.contains(cls);
  document.querySelectorAll('[data-layout="'+kind+'"]').forEach(b=>b.classList.toggle('on',on));
  try{
    var s=JSON.parse(localStorage.getItem('tril_layout_v1')||'{}');
    s[kind]=on; localStorage.setItem('tril_layout_v1', JSON.stringify(s));
  }catch(e){}
}
function applyLayout(){
  var s={};
  try{ s=JSON.parse(localStorage.getItem('tril_layout_v1')||'{}'); }catch(e){}
  ['sidebar','topbar'].forEach(kind=>{
    var cls={sidebar:'hide-sidebar',topbar:'hide-topbar'}[kind];
    var on = s[kind] !== false;   // 默认显示
    document.body.classList.toggle(cls, !on);
    document.querySelectorAll('[data-layout="'+kind+'"]').forEach(b=>b.classList.toggle('on', on));
  });
}

/* ============ 显示设置（隐藏语言 / 正面 / 背面） ============ */
const DISPLAY_KEY = "tril_wrong_display_v1";
let displaySettings = {
  hiddenLangs: [],
  frontLang: "en",
  backLangs: ["bm","zh","th"],
  showExamples: true,
  panelOpen: false
};
try{
  const saved = JSON.parse(localStorage.getItem(DISPLAY_KEY) || "{}");
  if(saved && typeof saved === "object") Object.assign(displaySettings, saved);
}catch(e){}
if(!Array.isArray(displaySettings.hiddenLangs)) displaySettings.hiddenLangs = [];
if(!Array.isArray(displaySettings.backLangs)) displaySettings.backLangs = ["bm","zh","th"];
if(typeof displaySettings.frontLang !== "string") displaySettings.frontLang = "en";
if(typeof displaySettings.showExamples !== "boolean") displaySettings.showExamples = true;

function saveDisplaySettings(){
  try{ localStorage.setItem(DISPLAY_KEY, JSON.stringify(displaySettings)); }catch(e){}
}
function isLangVisible(lang){ return !displaySettings.hiddenLangs.includes(lang); }
function toggleDisplayPanel(){
  displaySettings.panelOpen = !displaySettings.panelOpen;
  saveDisplaySettings();
  applyDisplayPanel();
}
function applyDisplayPanel(){
  const body = document.getElementById("displayPanelBody");
  const arrow = document.getElementById("displayPanelArrow");
  if(!body) return;
  body.hidden = !displaySettings.panelOpen;
  if(arrow) arrow.textContent = displaySettings.panelOpen ? "▲" : "▼";
  ['en','bm','zh','th'].forEach(k => document.body.classList.toggle('hide-lang-'+k, !isLangVisible(k)));
  document.body.classList.toggle('hide-examples', !displaySettings.showExamples);
  document.querySelectorAll('[data-hidelang]').forEach(cb => { cb.checked = isLangVisible(cb.dataset.hidelang); });
  document.querySelectorAll('input[name="frontLang"]').forEach(r => { r.checked = (r.value === displaySettings.frontLang); });
  document.querySelectorAll('[data-backlang]').forEach(cb => { cb.checked = displaySettings.backLangs.includes(cb.dataset.backlang); });
  const exCb = document.querySelector('[data-showexamples]');
  if(exCb) exCb.checked = displaySettings.showExamples;
}
function bindDisplayPanel(){
  document.querySelectorAll('[data-hidelang]').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.hidelang;
      const i = displaySettings.hiddenLangs.indexOf(k);
      if(cb.checked){ if(i>=0) displaySettings.hiddenLangs.splice(i,1); }
      else { if(i<0) displaySettings.hiddenLangs.push(k); }
      saveDisplaySettings();
      applyDisplayPanel();
      renderCard();
    };
  });
  document.querySelectorAll('input[name="frontLang"]').forEach(r => {
    r.onchange = () => {
      displaySettings.frontLang = r.value;
      saveDisplaySettings();
      renderCard();
    };
  });
  document.querySelectorAll('[data-backlang]').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.backlang;
      const i = displaySettings.backLangs.indexOf(k);
      if(cb.checked){ if(i<0) displaySettings.backLangs.push(k); }
      else { if(i>=0) displaySettings.backLangs.splice(i,1); }
      saveDisplaySettings();
      applyDisplayPanel();
      renderCard();
    };
  });
  document.querySelectorAll('[data-showexamples]').forEach(cb => {
    cb.onchange = () => {
      displaySettings.showExamples = cb.checked;
      saveDisplaySettings();
      applyDisplayPanel();
    };
  });
}
function frontHtmlByLang(e){
  const map = {
    en: { val: e.en,    pron: e.en_ipa,             lang: "en" },
    bm: { val: e.bm,    pron: e.bm_pron || e.bm_ipa, lang: "bm" },
    zh: { val: e.zh,    pron: e.zh_pinyin,          lang: "zh" },
    th: { val: e.th,    pron: e.th_pron,            lang: "th" }
  };
  const f = map[displaySettings.frontLang] || map.en;
  const val = f.val || "";
  const safe = String(val).replace(/'/g, "\\'");
  return '<div class="front-en lang-' + f.lang + '">' + escapeHtml(val) +
    ' <button class="ghost" style="padding:4px 8px;min-height:28px;font-size:14px;vertical-align:middle" onclick="event.stopPropagation();speak(\'' + safe + '\',\'' + f.lang + '\')">🔊</button></div>' +
    '<div class="front-ipa lang-' + f.lang + '">' + escapeHtml(f.pron || "") + '</div>';
}
function backRowHtml(label, val, phonetic, lang){
  if(!displaySettings.backLangs.includes(lang)) return '';
  return rowHtml(label, val, phonetic, lang);
}
function autoSpeakFront(e){
  const map = { en: {val: e.en, lang:"en"}, bm: {val: e.bm, lang:"bm"}, zh: {val: e.zh, lang:"zh"}, th: {val: e.th, lang:"th"} };
  const f = map[displaySettings.frontLang] || map.en;
  try{ speak(f.val || "", f.lang); }catch(_){}
}

/* ============ 启动 ============ */
window.addEventListener("load", function(){
  applyLayout();
  document.querySelectorAll('[data-layout]').forEach(b => { b.onclick = ()=>toggleLayout(b.dataset.layout); });
  applyDisplayPanel();
  bindDisplayPanel();
  setTimeout(function(){
    const s = document.getElementById("trilSpinner");
    if(s) s.remove();
  }, 200);

  /* 立即渲染侧栏（词库未就绪时显示 loading 占位） */
  renderNav();

  /* 主页链接来的定位 */
  try{
    const h = location.hash.replace(/^#/,"");
    if(h){
      const p = {};
      h.split("&").forEach(kv => { const [k,v] = kv.split("="); if(k) p[k] = v; });
      const si = parseInt(p.si, 10), fi = parseInt(p.fi, 10);
      if(!isNaN(si) && si >= 0 && libStages && libStages[si]){
        if(!isNaN(fi) && fi >= 0 && libStages[si].files[fi]){ goLevel(3, si, fi); }
        else { goLevel(2, si, -1); }
      }
    }
  }catch(e){}

  loadWrongbookAsync().then(function(){
    buildQueueAndRender();
  });
});

window.addEventListener("beforeunload", function(){
  try{ saveWrongbook(); }catch(e){}
});
</script>
