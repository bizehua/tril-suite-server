<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="tril-skin.css">
<script src="tril-skin.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<title>四语艾宾浩斯复习</title>
<style>
:root{
  --bg:#0e1320; --bg2:#151c2e; --panel:#1a2238; --panel2:#212c47;
  --line:#2c3756; --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  --en:#5b8cff; --bm:#ffb454; --zh:#4fd1a5; --th:#c792ea; --danger:#ff6b6b;
  --ok:#4fd1a5; --warn:#ffb454; --bad:#ff6b6b;
  --glow:0 0 0 2px rgba(91,140,255,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(20,28,46,.85);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{font-size:11px;color:var(--muted)}
header .spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 12px;font-size:13px;
  background:var(--panel2);color:var(--txt);transition:.15s;border:1px solid var(--line);min-height:40px}
button:hover{background:var(--btn-hover)}
button.primary{background:linear-gradient(90deg,var(--en),var(--grad-2));border:none;font-weight:700;color:#fff}
button.ghost{background:transparent}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
button.r-no{background:rgba(255,107,107,.18);border-color:var(--danger);color:#ffd0d0}
button.r-no:hover{background:rgba(255,107,107,.32)}
button.r-fz{background:rgba(255,180,84,.18);border-color:var(--warn);color:#ffe6c1}
button.r-fz:hover{background:rgba(255,180,84,.32)}
button.r-ok{background:rgba(79,209,165,.18);border-color:var(--ok);color:#c5f3e3}
button.r-ok:hover{background:rgba(79,209,165,.32)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;color:var(--muted)}
.chip strong{color:var(--txt);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.l0{background:#ff6b6b}.dot.l1{background:#ff9a3c}.dot.l2{background:#ffd166}.dot.l3{background:#a3d977}
.dot.l4{background:#4fd1a5}.dot.l5{background:#3da9c4}.dot.l6{background:#5b8cff}

main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

/* ===== 顶部统计 ===== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sc .lbl{font-size:11px;color:var(--muted)}
.sc .val{font-size:22px;font-weight:700;margin-top:2px}
.sc .val.lvl{font-size:14px;color:var(--muted);font-weight:500}
.sc .val.ok{color:var(--ok)}
.sc .val.bad{color:var(--bad)}
.sc .val.warn{color:var(--warn)}

/* ===== 过滤器 ===== */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:11px;color:var(--muted);margin-right:2px}
.filters button{padding:6px 10px;font-size:12px;min-height:32px}

/* ===== 卡片 ===== */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
.card{width:min(560px,100%);min-height:380px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer}
.card .corner{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.card .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .front-en{font-size:36px;font-weight:700;color:var(--en);line-height:1.2;text-align:center;margin:auto 0;letter-spacing:.5px}
.card .front-ipa{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px}
.card .back{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.card .back.hidden{display:none}
.card .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .row .lbl{min-width:34px;font-size:12px;color:var(--muted);text-align:right}
.card .row .val{font-size:18px;font-weight:600;line-height:1.4;flex:1}
.card .row .py{font-size:11px;color:var(--muted)}
.card.zen{background:var(--panel);border-color:var(--accent);box-shadow:var(--glow)}
.card.zen .front-en{font-size:48px}

.rate{display:grid;grid-template-columns:1fr 1fr 1fr 0.7fr;gap:8px;margin-top:14px}
.rate button{font-weight:700;font-size:14px;min-height:54px}
.rate.hidden{display:none}

.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.empty h2{color:var(--txt);font-size:18px;margin:0 0 8px}
.empty p{font-size:13px;line-height:1.7;margin:6px 0}
.empty .hint{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;margin:14px auto;max-width:480px;font-size:13px}
.empty .hint b{color:var(--accent)}

/* ===== 进度条 ===== */
.foot{padding:8px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:rgba(20,28,46,.7)}
.progress{flex:1;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--grad-2));transition:width .25s}

.ttsbanner{position:fixed;bottom:12px;left:12px;right:12px;max-width:480px;margin:0 auto;background:#3a1a1a;color:#ffd0d0;
  border:1px solid #6e3a3a;border-radius:8px;padding:10px 12px;font-size:12px;display:none;z-index:9999;line-height:1.6}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .rate{grid-template-columns:1fr 1fr;gap:6px}
  .rate button.skip{margin-top:6px}
  .card .front-en{font-size:28px}
  header h1{font-size:14px}
}
</style>
</head>
<body>

<header>
  <h1>🔁 四语艾宾浩斯复习</h1>
  <span class="sub">间隔重复 · 模糊答案 ×1.2</span>
  <span class="spacer"></span>
  <span class="chip" id="queueChip">队列 —</span>
  <button onclick="TrilAI && TrilAI.toggle()" title="问 AI">🤖 问 AI</button>
  <button onclick="TrilTTS && TrilTTS.toggle()" title="朗读">🎚 朗读</button>
  <button class="ghost" onclick="if(confirm('确定清空所有 SRS 复习进度？（不可恢复）')){localStorage.removeItem('tril_review_v1');localStorage.removeItem('tril_review_meta_v1');location.reload();}">🗑 重置</button>
</header>

<main id="main"></main>

<div class="foot">
  <div class="progress"><i id="progFill" style="width:0%"></i></div>
  <span class="chip" id="footChip">开始</span>
  <button class="ghost" onclick="exportSRS()" title="导出复习进度（JSON）">⤴</button>
  <button class="ghost" onclick="exportSRS_TSV()" title="导出当前词条为 TSV">⤓ TSV</button>
  <button class="ghost" onclick="document.getElementById('impInput').click()" title="导入复习进度">⤵</button>
  <input type="file" id="impInput" accept=".json" style="display:none" onchange="importSRS(event)">
</div>

<div id="trilSpinner" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1320;color:#93a0bd;z-index:99999;font:14px system-ui">⏳ 正在加载词库…</div>

<script src="tril-db.js"></script>
<script src="tril-migrate.js"></script>
<script src="tril-csv.js"></script>
<script src="三语母语习得核心词库.part1.js"></script>
<script src="三语母语习得核心词库.part2.js"></script>
<script src="三语母语习得核心词库.part3.js"></script>
<script src="三语母语习得核心词库.part4.js"></script>
<script>window.__TRIL_DATA__=[].concat.apply([], window.__TRIL_PARTS__);</script>
<script src="tril-lib.js"></script>
<script>
"use strict";

/* ============ 常量与语言定义 ============ */
const LANGS=[
  {k:"en",label:"英文",short:"EN",cls:"l-en",color:"#5b8cff"},
  {k:"bm",label:"马来文",short:"BM",cls:"l-bm",color:"#ffb454"},
  {k:"zh",label:"中文",short:"ZH",cls:"l-zh",color:"#4fd1a5"},
  {k:"th",label:"泰文",short:"TH",cls:"l-th",color:"#c792ea"}
];
const DAY = 86400000;
const LS_REVIEW = "tril_review_v1";
const LS_REVIEW_META = "tril_review_meta_v1";   // 首次发现时间 / 来源等
const LS_FLASHCARD_MASTERY = "tril_flash_mastery_v1";
const LS_FLASHCARD_DONE = "tril_flash_done_v1";
const LS_WRONG = "tril_wrongbook_v1";
const LS_MARKS = "tril_marks_v1";

/* SRS 间隔表（level → 间隔天数） */
const INTERVAL_TABLE = [1, 2, 4, 8, 16, 32, 60];   // level 0..6
const MAX_LEVEL = 6;

const DATA = window.__TRIL_DATA__;
if(window.TrilLib) TrilLib.mergeStages(DATA);

/* ============ 持久化加载 ============ */
let srs = {};          // {key: {level, last_interval, last_review, next_review, forgotten, reviews_total, src}}
let reviewMeta = {};
try{ srs = JSON.parse(localStorage.getItem(LS_REVIEW) || "{}") || {}; }catch(e){ srs = {}; }
try{ reviewMeta = JSON.parse(localStorage.getItem(LS_REVIEW_META) || "{}") || {}; }catch(e){ reviewMeta = {}; }
function saveSRS(){ try{ localStorage.setItem(LS_REVIEW, JSON.stringify(srs)); }catch(e){} }
function saveReviewMeta(){ try{ localStorage.setItem(LS_REVIEW_META, JSON.stringify(reviewMeta)); }catch(e){} }

function mkKey(e){
  return (e.en || "") + "|" + (e.bm || "") + "|" + (e.zh || "") + "|" + (e.th || "");
}

function toast(msg){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;z-index:99998;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4)";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1700);
}

/* ============ 入口聚合：从闪记/测试器/学习器收集所有复习候选 ============ */
let candidates = [];   // [{key, entry, src}] — 每个唯一词条

(function harvestFromData(){
  // 直接走全部词库，所有学段合一遍
  const seen = new Set();
  DATA.stages.forEach((st, si) => {
    st.files.forEach((f, fi) => {
      f.units.forEach((u, ui) => {
        const ents = u.entries || [];
        ents.forEach((e, ei) => {
          if(!e) return;
          const k = mkKey(e);
          if(!k || k === "|||") return;     // 空词条略过
          if(seen.has(k)) return;
          seen.add(k);
          candidates.push({key: k, entry: e, src: {si, fi, ui, ei, unit: u.title, stage: st.name}});
        });
      });
    });
  });
})();

function harvestFromApps(){
  // 闪记 mastery uid#key → 推回词条 entry（在同一份 DATA 里查）
  function findEntryByKey(key){
    return candidates.find(c => c.key === key);
  }
  // 闪记 mastery: {uid#key: "yes"|"no"|"fuzzy"}
  let masterMap = {};
  try{ masterMap = JSON.parse(localStorage.getItem(LS_FLASHCARD_MASTERY) || "{}") || {}; }catch(e){}
  Object.keys(masterMap).forEach(composite => {
    const hashAt = composite.lastIndexOf("#");
    if(hashAt < 0) return;
    const key = composite.slice(hashAt + 1);
    const master = masterMap[composite];
    const c = findEntryByKey(key);
    if(!c) return;
    c.flashMaster = master;     // "yes" | "no" | "fuzzy"
  });

  // 测试器错题本
  let wrong = {};
  try{ wrong = JSON.parse(localStorage.getItem(LS_WRONG) || "{}") || {}; }catch(e){}
  Object.keys(wrong).forEach(key => {
    const c = findEntryByKey(key);
    if(!c) return;
    c.wrong = wrong[key].wrong || 0;
    c.wrongStreak = wrong[key].streak || 0;
  });

  // 学习器 ★ 收藏
  let marks = {};
  try{ marks = JSON.parse(localStorage.getItem(LS_MARKS) || "{}") || {}; }catch(e){}
  Object.keys(marks).forEach(key => {
    const c = findEntryByKey(key);
    if(!c) return;
    c.marked = true;
  });
}

harvestFromApps();

/* 把所有「有活动」的 entry 拉进 srs；已掌握的（level>=5 且 last_review<30d 前）保留；
   已删/未活动的 key 不主动删，留着不显示即可。 */
function ensureSrsState(key, seed){
  if(srs[key]) return srs[key];
  const now = Date.now();
  // 新建：level 0，1 天后到期
  const baseInterval = (seed && seed.interval) || 1;
  srs[key] = {
    level: (seed && typeof seed.level === "number") ? seed.level : 0,
    last_interval: baseInterval,
    last_review: now,
    next_review: now + baseInterval * DAY,
    forgotten: (seed && seed.forgotten) || 0,
    reviews_total: 0,
    src: (seed && seed.src) || "manual"
  };
  return srs[key];
}

/* ============ 核心算法：B1-2 模糊 ×1.2 ============ */
function calcNext(state, rating){
  const now = Date.now();
  let level = state.level || 0;
  let interval = state.last_interval || 1;
  let forgotten = state.forgotten || 0;
  let reviews_total = state.reviews_total || 0;

  if(rating === "unknown"){
    level = 0;
    interval = 1;
    forgotten += 1;
    reviews_total += 1;
  } else if(rating === "fuzzy"){
    // B1-2: 模糊 = 间隔 ×1.2 (level 不升级,仅延长节奏)；保底 2d 避免 1d 起步粘死
    interval = Math.max(2, Math.round(interval * 1.2));
    reviews_total += 1;
  } else { // "know"
    level = Math.min(MAX_LEVEL, level + 1);
    interval = INTERVAL_TABLE[level];
    reviews_total += 1;
  }

  state.level = level;
  state.last_interval = interval;
  state.last_review = now;
  state.next_review = now + interval * DAY;
  state.forgotten = forgotten;
  state.reviews_total = reviews_total;
  state.last_rating = rating;
  return state;
}

function levelToColor(level){
  if(level <= 0) return "#ff6b6b";
  if(level === 1) return "#ff9a3c";
  if(level === 2) return "#ffd166";
  if(level === 3) return "#a3d977";
  if(level === 4) return "#4fd1a5";
  if(level === 5) return "#3da9c4";
  return "#5b8cff";
}

/* ============ TTS（同闪记） ============ */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, lang, onend){
  if(!text){ if(onend) onend(); return; }
  if(!window.speechSynthesis){ return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang==="en"?"en-US":lang==="bm"?"ms-MY":lang==="zh"?"zh-CN":"th-TH";
  u.rate = 1; u.volume = 1;
  u.onend = () => { if(onend) onend(); };
  u.onerror = () => { if(onend) onend(); };
  try{ speechSynthesis.resume(); }catch(e){}
  speechSynthesis.speak(u);
}

/* ============ 队列管理 ============ */
let filterMode = "due";   // "due" | "all" | "fuzzy" | "wrong" | "marked"
let queue = [];
let pos = -1;
let flipped = false;

function buildQueue(){
  // 入口：把 candidates → srs（仅在「due/all」模式下才纳入，其余过滤模式下用现有 srs）
  // 简化策略：
  // - 「due」：srs 里 next_review ≤ now 的；以及「首次发现」的需要学习者主动加进来的（新学过的单元、错题本、★ 收藏）
  // - 「fuzzy/wrong/marked」：从 candidates 筛，再触发 ensureSrsState（不影响现存 high-level 已掌握词）
  const now = Date.now();
  const out = [];

  if(filterMode === "due"){
    Object.keys(srs).forEach(k => {
      const st = srs[k];
      if(st.next_review <= now){
        const c = findEntryByKey(k);
        if(c) out.push(c);
      }
    });
    return out;
  }

  if(filterMode === "all"){
    return candidates.slice();
  }

  // 其余：直接从 candidates 筛（首次也会拉进来）
  if(filterMode === "fuzzy"){
    candidates.forEach(c => {
      if(c.flashMaster === "fuzzy") out.push(c);
      else if(c.wrong && c.wrongStreak === 0) out.push(c);    // 测试器刚答错又答对一次算模糊
    });
  } else if(filterMode === "wrong"){
    candidates.forEach(c => { if(c.wrong && c.wrong > 0) out.push(c); });
  } else if(filterMode === "marked"){
    candidates.forEach(c => { if(c.marked) out.push(c); });
  }
  return out;
}

function buildQueueAndRender(){
  queue = buildQueue();
  // 去重 + 按 next_review 升序
  const seen = new Set();
  queue = queue.filter(c => {
    if(!c || !c.entry || !c.entry.en) return false;
    if(seen.has(c.key)) return false;
    seen.add(c.key);
    return true;
  });
  queue.sort((a, b) => {
    const na = (srs[a.key] && srs[a.key].next_review) || 0;
    const nb = (srs[b.key] && srs[b.key].next_review) || 0;
    return na - nb;
  });
  pos = -1;
  render();
}

/* ============ UI 渲染 ============ */
function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderEmpty(){
  const main = document.getElementById("main");
  main.innerHTML = '<div class="empty">' +
    '<h2>📭 当前没有需要复习的词条</h2>' +
    '<p>到期队列为空。可以：</p>' +
    '<div class="hint">' +
    '<p>① <b>从学习器学几个单元</b> → 在闪记里给词条打分，下次到期会自动入复习队列。</p>' +
    '<p>② <b>在测试器答错的词</b> → 自动加入错题本，过 1 天后到期。</p>' +
    '<p>③ <b>★ 收藏你想重点巩固的词</b> → 在学习器表格里点星标，再切到「★ 收藏」即可开始复习。</p>' +
    '<p>④ <b>手动添加</b> → 切换右上角过滤器到「全部词条」开始轮转。</p>' +
    '</div>' +
    '</div>';
  document.getElementById("progFill").style.width = "0%";
  document.getElementById("footChip").textContent = "无任务";
}

function renderCard(){
  const main = document.getElementById("main");
  if(queue.length === 0){ renderEmpty(); return; }
  if(pos >= queue.length){
    renderSummary();
    return;
  }
  if(pos < 0) pos = 0;

  const c = queue[pos];
  const e = c.entry;
  const st = srs[c.key] || ensureSrsState(c.key, {});
  const lvlColor = levelToColor(st.level);

  let levelsHtml = '';
  for(let i = 0; i <= MAX_LEVEL; i++){
    levelsHtml += '<span class="dot ' + (i <= st.level ? 'l'+i : 'l'+i) + '" style="opacity:' + (i <= st.level ? 1 : 0.18) + '"></span>';
  }

  let metaBadges = '';
  if(c.flashMaster) metaBadges += '<span class="chip">' + (c.flashMaster === "yes" ? "✓ 已掌握" : c.flashMaster === "fuzzy" ? "? 模糊" : "✗ 不认识") + '</span>';
  if(c.wrong) metaBadges += '<span class="chip" style="color:#ffc9c9">错 ' + c.wrong + '</span>';
  if(c.marked) metaBadges += '<span class="chip" style="color:#ffd166">★ 收藏</span>';

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="corner">' +
      '<span class="chip" style="border-color:' + lvlColor + '">' +
        '<span class="dot" style="background:' + lvlColor + '"></span>' +
        ' L' + st.level + '/' + MAX_LEVEL +
      '</span>' +
    '</div>' +
    '<div class="meta">' +
      '<span class="chip">' + escapeHtml(c.src.stage + ' · ' + c.src.unit) + '</span>' +
      metaBadges +
      '<span class="spacer" style="flex:1"></span>' +
      '<span class="chip">第 ' + (pos+1) + '/' + queue.length + ' 张</span>' +
    '</div>' +
    '<div class="front-en">' + escapeHtml(e.en || "") + ' <button class="ghost" style="padding:4px 8px;min-height:28px;font-size:14px;vertical-align:middle" onclick="event.stopPropagation();speak(\'' + (e.en||"").replace(/'/g, "\\'") + '\',\'en\')">🔊</button></div>' +
    '<div class="front-ipa">' + escapeHtml(e.en_ipa || "") + '</div>' +
    '<div class="levels" style="display:flex;gap:4px;justify-content:center;margin-top:4px">' + levelsHtml + '</div>' +
    '<div class="back ' + (flipped ? '' : 'hidden') + '">' +
      rowHtml("马来", e.bm, e.bm_ipa) +
      rowHtml("中文", e.zh, "") +
      rowHtml("泰文", e.th, "") +
      (e.example_zh || e.example_en ? '<div class="row" style="margin-top:4px"><span class="lbl">例句</span><div class="val" style="font-weight:400;font-size:14px">' + escapeHtml(e.example_en || "") + (e.example_zh ? '<br><span style="color:var(--muted);font-size:13px">' + escapeHtml(e.example_zh) + '</span>' : '') + '</div></div>' : '') +
    '</div>' +
    '<div class="rate ' + (flipped ? '' : 'hidden') + '">' +
      '<button class="r-no" onclick="event.stopPropagation();rate(\'unknown\')">✗ 不认识</button>' +
      '<button class="r-fz" onclick="event.stopPropagation();rate(\'fuzzy\')">? 模糊 ×1.2</button>' +
      '<button class="r-ok" onclick="event.stopPropagation();rate(\'know\')">✓ 认识</button>' +
      '<button class="skip ghost" onclick="event.stopPropagation();skip()" title="本轮跳过，不改 SRS">⏭ 跳过</button>' +
    '</div>';

  card.onclick = (ev) => {
    // 点击空白处翻面（按钮有自己的 stopPropagation）
    if(!flipped){ flipped = true; renderCard(); }
  };

  main.innerHTML = '';
  main.appendChild(card);

  // 自动朗读英文
  setTimeout(()=>{ try{ speak(e.en, 'en'); }catch(_){} }, 80);

  // 更新底部进度
  const pct = queue.length ? Math.round((pos) / queue.length * 100) : 0;
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("footChip").textContent = (pos+1) + " / " + queue.length + " · 待评 " + (queue.length - pos);
}

function rowHtml(label, val, ipa){
  if(!val) return '';
  return '<div class="row"><span class="lbl">' + label + '</span><div class="val">' + escapeHtml(val) + (ipa ? '<span class="py"> · ' + escapeHtml(ipa) + '</span>' : '') + '</div></div>';
}

function renderSummary(){
  const main = document.getElementById("main");
  let total = 0, known = 0, fuzzy = 0, unknown = 0;
  Object.keys(srs).forEach(k => {
    const r = srs[k];
    total++;
    if(r.last_rating === "know") known++;
    else if(r.last_rating === "fuzzy") fuzzy++;
    else if(r.last_rating === "unknown") unknown++;
  });
  main.innerHTML = '<div class="empty">' +
    '<h2>🎉 本轮复习完成</h2>' +
    '<p>本次评级分布：<b style="color:var(--ok)">✓ ' + known + '</b> · <b style="color:var(--warn)">? ' + fuzzy + '</b> · <b style="color:var(--bad)">✗ ' + unknown + '</b></p>' +
    '<p style="margin-top:14px">下次到期时间已按 模糊 ×1.2 重新排好，明天见 👋</p>' +
    '<div class="hint">' +
    '<p>SRS 库共 <b>' + total + '</b> 条词条；到期日 < 1 天的有 <b>' + Object.values(srs).filter(s => s.next_review < Date.now() + DAY).length + '</b> 条。</p>' +
    '<p>点 ⟲ <b>再来一轮</b> 继续复习错过的；切到「★ 收藏」或「错题本」补充其他类型。</p>' +
    '</div>' +
    '<div style="margin-top:18px">' +
    '<button class="primary" onclick="buildQueueAndRender()" style="margin-right:8px">⟲ 再来一轮</button>' +
    '<button onclick="filterMode=\'due\';render();buildQueueAndRender()">📅 仅今天到期</button>' +
    '</div>' +
    '</div>';
  document.getElementById("progFill").style.width = "100%";
  document.getElementById("footChip").textContent = "完成 ✓";
}

function updateHeaderStats(){
  const now = Date.now();
  const due = Object.values(srs).filter(s => s.next_review <= now).length;
  const week = Object.values(srs).filter(s => s.next_review <= now + 7*DAY).length;
  const mastered = Object.values(srs).filter(s => s.level >= 5).length;
  const total = Object.keys(srs).length;
  document.getElementById("queueChip").innerHTML = '<strong>' + due + '</strong> 到期 / ' + week + ' 周内 / ' + mastered + ' 掌握 / ' + total + ' 总';
}

function renderFilters(){
  let bar = document.querySelector(".filters");
  if(!bar){
    const main = document.getElementById("main");
    bar = document.createElement("div");
    bar.className = "filters";
    main.insertBefore(bar, main.firstChild);
  }
  bar.innerHTML = '<span class="lbl">过滤：</span>';
  const opts = [
    {k:"due", t:"📅 今日到期"},
    {k:"all", t:"🌐 全部词条"},
    {k:"fuzzy", t:"? 模糊"},
    {k:"wrong", t:"📕 错题本"},
    {k:"marked", t:"★ 收藏"}
  ];
  opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o.t;
    if(o.k === filterMode) b.classList.add("active");
    b.onclick = () => { filterMode = o.k; buildQueueAndRender(); };
    bar.appendChild(b);
  });
}

function rate(rating){
  if(pos < 0 || pos >= queue.length) return;
  const c = queue[pos];
  const st = ensureSrsState(c.key, {});
  const before = st.level;
  calcNext(st, rating);
  saveSRS();
  // 闪记 mastery 同步（保证跨应用一致）
  try{
    const mast = JSON.parse(localStorage.getItem(LS_FLASHCARD_MASTERY) || "{}") || {};
    // 没有 uid 信息的话用 src.unit 拼一个虚拟 uid
    const uid = (c.src.si||0) + "_" + (c.src.fi||0) + "_" + (c.src.ui||0);
    mast[uid + "#" + c.key] = rating === "know" ? "yes" : rating === "fuzzy" ? "fuzzy" : "no";
    localStorage.setItem(LS_FLASHCARD_MASTERY, JSON.stringify(mast));
  }catch(e){}
  flipped = false;
  pos++;
  renderCard();
  updateHeaderStats();
}

function skip(){
  flipped = false;
  pos++;
  renderCard();
}

function render(){
  updateHeaderStats();
  renderFilters();
}

function exportSRS(){
  const data = {v:1, exported_at:new Date().toISOString(), srs, meta: reviewMeta};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tril_review_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast("已导出 SRS 进度");
}
function exportSRS_TSV(){
  // 把当前队列（candidates）的全四语条目导出成 TSV，方便 Excel 复习
  if(!window.trilCSV){ toast("CSV 模块未加载"); return; }
  const rows = candidates.map(c => c.entry).filter(e => e && (e.en||e.bm||e.zh||e.th));
  const x = trilCSV.exportEntries(rows, "tril_review_words_" + new Date().toISOString().slice(0,10) + ".tsv");
  toast("已导出 " + x + " 条 → TSV");
}
function importSRS(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data || !data.srs) throw new Error("invalid");
      srs = data.srs;
      reviewMeta = data.meta || {};
      saveSRS(); saveReviewMeta();
      buildQueueAndRender();
      toast("已导入 " + Object.keys(srs).length + " 条");
    }catch(e){ toast("导入失败：" + e.message); }
  };
  r.readAsText(f);
  ev.target.value = "";
}

/* ============ 启动 ============ */
window.addEventListener("load", function(){
  setTimeout(function(){
    const s = document.getElementById("trilSpinner");
    if(s) s.remove();
  }, 300);
  buildQueueAndRender();
});

window.addEventListener("beforeunload", function(){
  try{ saveSRS(); saveReviewMeta(); }catch(e){}
});
</script>
