<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="tril-skin.css">
<script src="tril-skin.js"></script>
<script src="tril-skin-widget.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<title>四语艾宾浩斯复习</title>
<style>
:root{
  --bg:#0e1320; --bg2:#151c2e; --panel:#1a2238; --panel2:#212c47;
  --line:#2c3756; --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  --en:#5b8cff; --bm:#ffb454; --zh:#4fd1a5; --th:#c792ea; --danger:#ff6b6b;
  --ok:#4fd1a5; --warn:#ffb454; --bad:#ff6b6b;
  --glow:0 0 0 2px rgba(91,140,255,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(20,28,46,.85);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{font-size:11px;color:var(--muted)}
header .spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 12px;font-size:13px;
  background:var(--panel2);color:var(--txt);transition:.15s;border:1px solid var(--line);min-height:40px}
button:hover{background:var(--btn-hover)}
button.primary{background:linear-gradient(90deg,var(--en),var(--grad-2));border:none;font-weight:700;color:#fff}
button.ghost{background:transparent}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
button.r-no{background:rgba(255,107,107,.18);border-color:var(--danger);color:#ffd0d0}
button.r-no:hover{background:rgba(255,107,107,.32)}
button.r-fz{background:rgba(255,180,84,.18);border-color:var(--warn);color:#ffe6c1}
button.r-fz:hover{background:rgba(255,180,84,.32)}
button.r-ok{background:rgba(79,209,165,.18);border-color:var(--ok);color:#c5f3e3}
button.r-ok:hover{background:rgba(79,209,165,.32)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);font-size:11px;color:var(--muted)}
.chip strong{color:var(--txt);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.l0{background:#ff6b6b}.dot.l1{background:#ff9a3c}.dot.l2{background:#ffd166}.dot.l3{background:#a3d977}
.dot.l4{background:#4fd1a5}.dot.l5{background:#3da9c4}.dot.l6{background:#5b8cff}

main{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

/* ===== 顶部统计 ===== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sc .lbl{font-size:11px;color:var(--muted)}
.sc .val{font-size:22px;font-weight:700;margin-top:2px}
.sc .val.lvl{font-size:14px;color:var(--muted);font-weight:500}
.sc .val.ok{color:var(--ok)}
.sc .val.bad{color:var(--bad)}
.sc .val.warn{color:var(--warn)}

/* ===== 过滤器 ===== */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:11px;color:var(--muted);margin-right:2px}
.filters button{padding:6px 10px;font-size:12px;min-height:32px}

/* ===== 卡片 ===== */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
.card{width:min(560px,100%);min-height:380px;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer}
.card .corner{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.card .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .front-en{font-size:36px;font-weight:700;color:var(--en);line-height:1.2;text-align:center;margin:auto 0;letter-spacing:.5px}
.card .front-ipa{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px}
.card .back{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.card .back.hidden{display:none}
.card .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .row .lbl{min-width:34px;font-size:12px;color:var(--muted);text-align:right}
.card .row .val{font-size:18px;font-weight:600;line-height:1.4;flex:1}
.card .row .py{font-size:11px;color:var(--muted)}
.card.zen{background:var(--panel);border-color:var(--accent);box-shadow:var(--glow)}
.card.zen .front-en{font-size:48px}

.rate{display:grid;grid-template-columns:1fr 1fr 1fr 0.7fr;gap:8px;margin-top:14px}
.rate button{font-weight:700;font-size:14px;min-height:54px}
.rate.hidden{display:none}

.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.empty h2{color:var(--txt);font-size:18px;margin:0 0 8px}
.empty p{font-size:13px;line-height:1.7;margin:6px 0}
.empty .hint{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;margin:14px auto;max-width:480px;font-size:13px}
.empty .hint b{color:var(--accent)}

/* ===== 进度条 ===== */
.foot{padding:8px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:rgba(20,28,46,.7)}
.progress{flex:1;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--grad-2));transition:width .25s}

.ttsbanner{position:fixed;bottom:12px;left:12px;right:12px;max-width:480px;margin:0 auto;background:#3a1a1a;color:#ffd0d0;
  border:1px solid #6e3a3a;border-radius:8px;padding:10px 12px;font-size:12px;display:none;z-index:9999;line-height:1.6}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .rate{grid-template-columns:1fr 1fr;gap:6px}
  .rate button.skip{margin-top:6px}
  .card .front-en{font-size:28px}
  header h1{font-size:14px}
}
</style>
</head>
<body>

<header>
  <button class="ghost" onclick="goHome()" title="返回上一页 / 首页">← 返回</button>
  <h1>🔁 四语艾宾浩斯复习</h1>
  <span class="sub">间隔重复 · 模糊答案 ×1.2</span>
  <span class="spacer"></span>
  <span class="chip" id="queueChip">队列 —</span>
  <button class="laybtn iconbtn" data-layout="sidebar" title="显示 / 隐藏 左侧目录栏">☰ 目录</button>
  <button class="laybtn iconbtn" data-layout="topbar" title="显示 / 隐藏 顶部栏">▭ 顶栏</button>
  <button onclick="TrilAI && TrilAI.toggle()" title="问 AI">🤖 问 AI</button>
  <button onclick="TrilTTS && TrilTTS.toggle()" title="朗读">🎚 朗读</button>
  <button class="ghost" onclick="if(confirm('确定清空所有 SRS 复习进度？（不可恢复）')){localStorage.removeItem('tril_review_v1');localStorage.removeItem('tril_review_meta_v1');location.reload();}">🗑 重置</button>
</header>

<div id="displayPanel" class="display-panel">
  <div class="display-panel-header" onclick="toggleDisplayPanel()" title="折叠 / 展开显示控制">
    <span>👁 显示设置（隐藏语言 / 正面 / 背面）</span>
    <span id="displayPanelArrow">▼</span>
  </div>
  <div id="displayPanelBody" class="display-panel-body" hidden>
    <div class="display-section">
      <span class="sec-label">🔒 隐藏：</span>
      <label class="lang-toggle"><input type="checkbox" data-hidelang="en" checked> 🇬🇧 EN</label>
      <label class="lang-toggle"><input type="checkbox" data-hidelang="bm" checked> 🇲🇾 BM</label>
      <label class="lang-toggle"><input type="checkbox" data-hidelang="zh" checked> 🇨🇳 ZH</label>
      <label class="lang-toggle"><input type="checkbox" data-hidelang="th" checked> 🇹🇭 TH</label>
    </div>
    <div class="display-section">
      <span class="sec-label">👁 正面：</span>
      <label class="lang-radio"><input type="radio" name="frontLang" value="en" checked> 🇬🇧 EN</label>
      <label class="lang-radio"><input type="radio" name="frontLang" value="bm"> 🇲🇾 BM</label>
      <label class="lang-radio"><input type="radio" name="frontLang" value="zh"> 🇨🇳 ZH</label>
      <label class="lang-radio"><input type="radio" name="frontLang" value="th"> 🇹🇭 TH</label>
    </div>
    <div class="display-section">
      <span class="sec-label">📖 背面：</span>
      <label class="lang-toggle"><input type="checkbox" data-backlang="en"> 🇬🇧 EN</label>
      <label class="lang-toggle"><input type="checkbox" data-backlang="bm" checked> 🇲🇾 BM</label>
      <label class="lang-toggle"><input type="checkbox" data-backlang="zh" checked> 🇨🇳 ZH</label>
      <label class="lang-toggle"><input type="checkbox" data-backlang="th" checked> 🇹🇭 TH</label>
    </div>
  </div>
</div>

<div id="layoutDock">
  <button data-layout="sidebar" title="目录栏">☰ 目录</button>
  <button data-layout="topbar" title="顶部栏">▭ 顶栏</button>
</div>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="foot">
  <div class="progress"><i id="progFill" style="width:0%"></i></div>
  <span class="chip" id="footChip">开始</span>
  <button class="ghost" onclick="exportSRS()" title="导出复习进度（JSON）">⤴</button>
  <button class="ghost" onclick="exportSRS_TSV()" title="导出当前词条为 TSV">⤓ TSV</button>
  <button class="ghost" onclick="document.getElementById('impInput').click()" title="导入复习进度">⤵</button>
  <input type="file" id="impInput" accept=".json" style="display:none" onchange="importSRS(event)">
</div>

<div id="trilSpinner" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1320;color:#93a0bd;z-index:99999;font:14px system-ui">⏳ 正在加载词库…</div>

<script src="tril-db.js"></script>
<script src="tril-migrate.js"></script>
<script src="tril-csv.js"></script>
<script src="三语母语习得核心词库.index.js"></script>
<script src="tril-core.js"></script>
<script src="tril-lib.js"></script>
<script>
/* ⏳ 渐进式词库加载：外壳立即渲染，词库（约 30MB）后台下载并缓存到 IndexedDB，
   完成后动态注入应用脚本。第二次打开走本地缓存，秒开。 */
(function(){
  var APP = "app-review.js";
  var pill = document.createElement("div");
  pill.id = "trilLoadPill";
  pill.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99990;"+
    "background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:99px;"+
    "padding:9px 20px;font-size:13px;box-shadow:0 6px 18px var(--shadow);white-space:nowrap;"+
    "display:flex;align-items:center;gap:8px";
  pill.innerHTML = "⏳ <span>正在加载词库</span> <b id='trilLoadPct' style='color:var(--accent)'>0/4</b>"+
    "<span style='color:var(--muted);font-size:11px'>首次约 30MB · 之后走本地缓存</span>";
  function mount(){
    if(document.body){ document.body.appendChild(pill); }
    else { document.addEventListener("DOMContentLoaded", function(){ document.body.appendChild(pill); }, {once:true}); }
  }
  mount();
  var timer = setInterval(function(){
    try{
      var n = 0;
      for(var k = 0; k < 4; k++){ if(TrilCore.isLoaded(k)) n++; }
      var el = document.getElementById("trilLoadPct");
      if(el) el.textContent = n + "/4";
    }catch(e){}
  }, 400);
  function done(){ clearInterval(timer); if(pill.parentNode) pill.remove(); }
  function fail(){
    clearInterval(timer);
    pill.innerHTML = "⚠ 词库加载失败 — 请检查网络后刷新重试（离线包请确认 part 文件与本页同目录）";
    pill.style.borderColor = "var(--danger)";
  }
  TrilCore.loadAll().then(function(data){
    if(!data || !data.length) return fail();
    /* 组装为 {stages:[...]} — app 脚本期望的对象结构（修复原扁平数组 bug） */
    window.__TRIL_DATA__ = {stages: data};
    var s = document.createElement("script");
    s.src = APP;
    s.onload = done;
    s.onerror = fail;
    document.head.appendChild(s);
  }).catch(fail);
})();
</script>

<script>window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('trilSpinner');if(s)s.remove();},600);});</script>
<script src="tril-ai.js"></script>
<script src="tril-tts.js"></script>

</body>
</html>
