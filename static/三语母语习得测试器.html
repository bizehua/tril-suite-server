<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="tril-skin.css">
<script src="tril-skin.js"></script>
<script src="tril-skin-widget.js"></script>
<script src="tril-db.js"></script>
<script src="tril-migrate.js"></script>
<script src="tril-csv.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四语学习测试器</title>
<style>
:root{
  --bg:#0e1320; --bg2:#151c2e; --panel:#1a2238; --panel2:#212c47;
  --line:#2c3756; --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  --en:#5b8cff; --bm:#ffb454; --zh:#4fd1a5; --th:#c792ea; --danger:#ff6b6b; --ok:#4fd1a5;
  --glow:0 0 0 2px rgba(91,140,255,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(20,28,46,.7);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;color:var(--muted)}
header .spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:8px 13px;font-size:13px;
  background:var(--panel2);color:var(--txt);transition:.15s;border:1px solid var(--line)}
button:hover{background:var(--btn-hover)}
button.primary{background:linear-gradient(90deg,var(--en),var(--grad-2));border:none;font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{padding:7px 10px}

.layout{flex:1;display:flex;min-height:0}
nav{flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.navstage{margin-bottom:6px}
.navstage>h3{font-size:13px;margin:8px 6px 4px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px}
.navstage .cnt{font-size:11px;color:var(--muted);font-weight:400}
.navfile{display:block;width:100%;text-align:left;margin:2px 0;padding:7px 10px;font-size:13px;
  background:transparent;border:1px solid transparent;border-radius:8px;color:var(--txt)}
.navfile:hover{background:var(--panel2)}
.navfile.active{background:var(--panel2);border-color:var(--accent)}
.navfile .fc{float:right;color:var(--muted);font-size:11px}
.navfile .rt{float:right;color:var(--zh);font-size:10px;margin-right:6px}
.navunit{display:block;width:100%;text-align:left;margin:1px 0;padding:6px 12px;font-size:13px;
  background:transparent;border:1px solid transparent;border-left:3px solid var(--line);border-radius:0 8px 8px 0;color:var(--txt)}
.navunit:hover{background:var(--panel2)}
.navunit.active{background:var(--panel2);border-left-color:var(--accent)}
.navunit .fc{float:right;color:var(--muted);font-size:11px}
.navback{display:block;width:100%;text-align:left;margin:2px 0 6px;padding:5px 8px;font-size:12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer}
.navback:hover{color:var(--txt)}

main{flex:1;display:flex;flex-direction:column;min-width:0}
.unitlist{flex:1;overflow-y:auto;padding:18px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.breadcrumb b{color:var(--txt)}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;
  transition:.15s;position:relative;overflow:hidden}
.ucard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ucard .ut{font-size:14px;font-weight:600;line-height:1.4}
.ucard .umeta{font-size:11px;color:var(--muted);margin-top:6px}
.ucard .badge{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.ucard.done .badge{background:rgba(79,209,165,.18);color:var(--zh)}
.ucard .mini{height:4px;background:var(--panel2);border-radius:99px;margin-top:10px;overflow:hidden}
.ucard .mini>i{display:block;height:100%;background:var(--zh)}

/* 测试答题区 */
.quiz{flex:1;display:flex;flex-direction:column;min-height:0}
.quizbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.quizbar .lt{font-size:15px;font-weight:700}
.quizbar .back{margin-right:4px}
.qprog{font-size:12px;color:var(--muted)}
.qbar{flex:1;height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:120px}
.qbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--en),var(--bm),var(--zh),var(--th));transition:width .25s}
.qwrap{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;align-items:center}
.qcard{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qtag{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.qtag.en{color:var(--en);box-shadow:inset 0 0 0 1px var(--en)}
.qtag.bm{color:var(--bm);box-shadow:inset 0 0 0 1px var(--bm)}
.qtag.zh{color:var(--zh);box-shadow:inset 0 0 0 1px var(--zh)}
.qtag.th{color:var(--th);box-shadow:inset 0 0 0 1px var(--th)}
.qprompt{font-size:30px;font-weight:800;text-align:center;margin:18px 0;line-height:1.3}
.qprompt.l-en{color:var(--en)} .qprompt.l-bm{color:var(--bm)} .qprompt.l-zh{color:var(--zh)} .qprompt.l-th{color:var(--th)}
.qaudio{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}
.qlisten-hint{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:11px;width:100%;max-width:560px;margin:0 auto}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;font-size:16px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;color:var(--txt);transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:#27345a}
.opt .num{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.correct{background:rgba(79,209,165,.18);border-color:var(--ok);color:#bff3df}
.opt.wrong{background:rgba(255,107,107,.16);border-color:var(--danger);color:#ffc9c9}
.opt:disabled{cursor:default}

/* 拼写题 */
.spell-input input{outline:none;transition:.12s}
.spell-input input:focus{border-color:var(--accent)!important;background:#27345a!important;color:#fff}
#spellInp{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* 配对题 */
.match-hint{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.match-col{display:flex;flex-direction:column;gap:9px}
.match-left,.match-right{
  padding:11px 13px;background:var(--panel2);border:2px solid var(--line);
  border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px;
  font-size:15px;transition:.12s;user-select:none
}
.match-left:hover:not(.matched),.match-right:hover:not(.matched){border-color:var(--accent)}
.match-left.sel{background:#3a4a7a;border-color:var(--accent)}
.match-left.matched,.match-right.matched{cursor:default;opacity:.65}
.match-left.ok,.match-right.ok{background:rgba(79,209,165,.18);border-color:var(--ok);opacity:1}
.match-left.bad,.match-right.bad{background:rgba(255,107,107,.16);border-color:var(--danger);opacity:1}
.ml-no{flex:0 0 24px;height:24px;border-radius:6px;background:var(--panel);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}

@media (max-width:560px){
  .match-grid{grid-template-columns:1fr;gap:14px}
}
.feedback{width:100%;max-width:560px;margin:16px auto 0;padding:14px 16px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.7;display:none}
.feedback.show{display:block}
.feedback .row{margin:3px 0}
.feedback .en{color:#cfe0ff}.feedback .bm{color:#ffe2bb}.feedback .zh{color:#bff3df}.feedback .th{color:#e9d4ff}
.feedback .rk{color:var(--muted);font-size:12px}
.qnext{margin-top:16px;display:flex;justify-content:center;gap:10px}

/* 开始面板 */
.startpanel{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.startpanel h2{margin:0 0 6px;font-size:17px}
.startpanel .desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.field{margin-bottom:16px}
.field .lab{font-size:12px;color:var(--muted);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;font-size:13px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* 成绩面板 */
.result{flex:1;display:flex;align-items:center;justify-content:center}
.rcard{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}
.rcard .score{font-size:54px;font-weight:900;margin:6px 0}
.rcard .score small{font-size:20px;color:var(--muted)}
.rcard .msg{font-size:15px;margin:10px 0 20px}
.rcard .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:380px;max-width:92vw}
.modal h2{margin:0 0 14px;font-size:16px}
.field select,.field input[type=range]{width:100%}
.field select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--accent);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.ipa{font-size:12px;color:var(--muted);font-family:"Courier New",monospace;margin-left:5px}
.pron{font-size:12px;color:#caa46a;margin-left:5px}
.w{cursor:pointer;border-bottom:1px dotted var(--muted);transition:.12s;border-radius:3px;padding:0 2px}
.w:hover{color:#fff;border-bottom-color:#fff;background:rgba(91,140,255,.20)}
.w.en{color:#cfe0ff}.w.bm{color:#ffe2bb}.w.zh{color:#bff3df}.w.th{color:#e9d4ff}
.feedback .row{margin:6px 0;font-size:15px}
.feedback .hint{font-size:12px;color:var(--muted);margin-top:8px}
.review{margin-top:18px;text-align:left}
.rvhead{cursor:pointer;color:var(--accent);font-size:13px;padding:10px 0;border-top:1px solid var(--line);user-select:none}
.rvhead:hover{text-decoration:underline}
.rvlist{max-height:360px;overflow:auto;padding-top:6px}
.rvitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.75}
.rvitem .rva{margin-top:4px;color:var(--muted)}
.rvitem .ok{color:var(--ok);font-weight:600}.rvitem .bad{color:var(--danger);font-weight:600}
@media(max-width:820px){nav{flex-basis:160px}.unitgrid{grid-template-columns:1fr}.qprompt{font-size:24px}}
/* ===== 可折叠面板：左侧目录 / 例句区域 / 顶部栏 =====
   hide-sidebar / hide-topbar / nav transition 已统一到 tril-skin.css */
header{transition:max-height .3s ease,padding .3s ease,opacity .25s ease,border-width .3s ease;max-height:160px;overflow:hidden}
body.hide-topbar header{max-height:0;padding-top:0;padding-bottom:0;opacity:0;border-bottom-width:0;pointer-events:none}
body.hide-examples .example-block{display:none}
#layoutDock{position:fixed;right:12px;bottom:14px;z-index:45;display:flex;gap:6px;background:rgba(26,34,56,.88);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
#layoutDock button{font-size:12px;padding:7px 10px;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:5px}
#layoutDock button.on{background:linear-gradient(90deg,var(--en),var(--grad-2));border-color:transparent;color:#fff}
.laybtn{font-size:12px;padding:7px 10px}
.laybtn.on{background:linear-gradient(90deg,var(--en),var(--grad-2));border-color:transparent;color:#fff}
@media(max-width:820px){#layoutDock{right:8px;bottom:10px;padding:5px}#layoutDock button{padding:6px 8px;font-size:11px}}
</style>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <div class="unitlist" id="unitlist">
      <div class="empty">← 从左侧选择学段 / 单元开始自测</div>

    <div class="field"><label>泰语语音 (TH)</label><select id="voiceTh"></select>
      <button class="mini" id="testTh" type="button">🔊 试听泰语</button>
      <div class="note" id="thNote"></div></div>
    <div class="field"><label>语速：<span id="rateTxt">1.0</span>x</label>
      <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="1"></div>

      操作：选择题作答后即时判分并展示四语对照；听力题点击 🔊 播放后选择。<br>
      若点击「播放」听不到声音，请用 <b>Safari</b> 或 <b>Chrome</b> 浏览器打开本文件（双击即可）。
    </div>
    <div style="text-align:right;margin-top:10px"><button class="primary" id="closeSettings">完成</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ⏳ 渐进式词库加载：外壳立即渲染，词库（约 30MB）后台下载并缓存到 IndexedDB，
   完成后动态注入应用脚本。第二次打开走本地缓存，秒开。 */
(function(){
  var APP = "app-tester.js";
  var pill = document.createElement("div");
  pill.id = "trilLoadPill";
  pill.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99990;"+
    "background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:99px;"+
    "padding:9px 20px;font-size:13px;box-shadow:0 6px 18px var(--shadow);white-space:nowrap;"+
    "display:flex;align-items:center;gap:8px";
  pill.innerHTML = "⏳ <span>正在加载词库</span> <b id='trilLoadPct' style='color:var(--accent)'>0/4</b>"+
    "<span style='color:var(--muted);font-size:11px'>首次约 30MB · 之后走本地缓存</span>";
  function mount(){
    if(document.body){ document.body.appendChild(pill); }
    else { document.addEventListener("DOMContentLoaded", function(){ document.body.appendChild(pill); }, {once:true}); }
  }
  mount();
  var timer = setInterval(function(){
    try{
      var n = 0;
      for(var k = 0; k < 4; k++){ if(TrilCore.isLoaded(k)) n++; }
      var el = document.getElementById("trilLoadPct");
      if(el) el.textContent = n + "/4";
    }catch(e){}
  }, 400);
  function done(){ clearInterval(timer); if(pill.parentNode) pill.remove(); }
  function fail(){
    clearInterval(timer);
    pill.innerHTML = "⚠ 词库加载失败 — 请检查网络后刷新重试（离线包请确认 part 文件与本页同目录）";
    pill.style.borderColor = "var(--danger)";
  }
  TrilCore.loadAll().then(function(data){
    if(!data || !data.length) return fail();
    /* 组装为 {stages:[...]} — 三个 app 脚本期望的对象结构 */
    window.__TRIL_DATA__ = {stages: data};
    var s = document.createElement("script");
    s.src = APP;
    s.onload = done;
    s.onerror = fail;
    document.head.appendChild(s);
  }).catch(fail);
})();
</script>
<div id="trilSpinner" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1320;color:#93a0bd;z-index:99999;font:14px system-ui">⏳ 正在加载词库…</div>

}
</script>
